{# Shared Start + Duration -> End date control (static/js/date_duration.js). Presentation only; the caller reads the values and owns saving. #}
{% macro date_duration(prefix, start_label, end_label, start_value="", months_value="", unit="years", testid="") %}
<fieldset class="dd fx-ui" data-dd-root data-testid="{{ testid or prefix }}" aria-label="{{ start_label }} and duration">
  <label class="block text-sm font-medium text-gray-900 dark:text-white">{{ start_label }}<input data-dd="start" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" type="date" value="{{ start_value }}"></label>
  <label class="block text-sm font-medium text-gray-900 dark:text-white">Duration<input data-dd="duration" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" inputmode="decimal" autocomplete="off" value="{{ months_value }}" aria-describedby="{{ prefix }}-dd-note"></label>
  <label class="block text-sm font-medium text-gray-900 dark:text-white">Unit<select data-dd="unit" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white"><option value="years" {{ 'selected' if unit == 'years' }}>Years</option><option value="months" {{ 'selected' if unit == 'months' }}>Months</option></select></label>
  <label class="block text-sm font-medium text-gray-900 dark:text-white">{{ end_label }}<input data-dd="end" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white" type="date" readonly value=""></label>
  <label class="dd-manual"><input data-dd="manual" type="checkbox"> Specify end date manually</label>
  <button type="button" data-dd="reset" hidden class="text-gray-900 bg-white border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-3 py-1.5 dark:bg-gray-800 dark:text-white dark:border-gray-600 dark:hover:bg-gray-700">Use calculated end date</button>
  <p class="d-context dd-note text-sm text-gray-500 dark:text-gray-400 !border-0 !bg-transparent !p-0" id="{{ prefix }}-dd-note" data-dd="note" role="status"></p>
</fieldset>
{% endmacro %}
