  FINCO PROTOCOL — POWER USER — FLOATING JUMP-TO BUTTON  ·  UI-7 PART F

<div class="fo-power-jump">
  <button type="button"
          class="fo-power-jump__btn"
          data-fo-power-palette-trigger
          aria-label="Open command palette (Ctrl + K)">

    <span>Jump to…</span>

  </button>
</div>
