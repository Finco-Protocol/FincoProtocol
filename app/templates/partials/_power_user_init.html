<!--
  =======================================================================
  FINCO PROTOCOL — POWER USER INIT  ·  UI-7
  -----------------------------------------------------------------------
  Inline progressive-enhancement script that wires the command palette,
  global search, quick actions, keyboard shortcuts, jump-to navigation,
  recently-edited tracking, and skeleton states. Fails silently — the
  page still works without any of this.

  No new static JS file. No new backend endpoints. No persistence
  change. No calculation change.

  Re-uses:
    - window.switchTab (UI-3) for in-app tab navigation
    - HTMX (already loaded) for any /scenarios/... navigations
    - sessionStorage for recent tracking (session-only; cleared on
      browser close — explicit per UI-7 PART D)
  =======================================================================
-->
<script>
(function () {
  "use strict";
  // ────────────────────────────────────────────────────────────────────
  // Helpers
  // ────────────────────────────────────────────────────────────────────
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }
  function isEditingTarget(t) {
    if (!t) return false;
    var tag = (t.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return true;
    if (t.isContentEditable) return true;
    return false;
  }
  function getProjectCode() {
    try {
      var p = new URLSearchParams(window.location.search);
      return p.get("project") || "";
    } catch (e) { return ""; }
  }
  function getActiveScenario() {
    try {
      var el = document.querySelector("[data-fo-active-scenario]");
      return (el && el.textContent || "").trim() || "";
    } catch (e) { return ""; }
  }

  // ────────────────────────────────────────────────────────────────────
  // Fuzzy / substring search
  // ────────────────────────────────────────────────────────────────────
  function score(query, label) {
    if (!query) return 1.0; // empty query shows everything
    var q = query.toLowerCase();
    var l = (label || "").toLowerCase();
    if (l === q) return 1.0;
    if (l.indexOf(q) >= 0) return 0.8;
    // Subsequence match
    var qi = 0;
    for (var i = 0; i < l.length && qi < q.length; i++) {
      if (l[i] === q[qi]) qi++;
    }
    if (qi === q.length) return 0.5;
    return 0;
  }

  // ────────────────────────────────────────────────────────────────────
  // Command Palette
  // ────────────────────────────────────────────────────────────────────
  function initPalette() {
    var palette = $("[data-fo-power-palette]");
    var backdrop = $("[data-fo-power-palette-backdrop]");
    var input    = $("[data-fo-power-palette-input]");
    var results  = $("[data-fo-power-palette-results]");
    var count    = $("[data-fo-power-palette-count]");
    if (!palette || !backdrop || !input || !results) return;

    var triggers = $$("[data-fo-power-palette-trigger]");
    triggers.forEach(function (t) {
      t.addEventListener("click", open);
    });

    backdrop.addEventListener("click", close);

    var activeIndex = -1;

    function open() {
      palette.hidden = false;
      backdrop.hidden = false;
      // Force a layout flush before adding the class so the
      // CSS transition runs.
      void palette.offsetWidth;
      palette.classList.add("is-open");
      backdrop.classList.add("is-open");
      input.value = "";
      render("");
      setTimeout(function () { input.focus(); }, 0);
      document.addEventListener("keydown", paletteKeyHandler);
    }
    function close() {
      palette.classList.remove("is-open");
      backdrop.classList.remove("is-open");
      setTimeout(function () {
        palette.hidden = true;
        backdrop.hidden = true;
      }, 120);
      document.removeEventListener("keydown", paletteKeyHandler);
    }

    function paletteKeyHandler(e) {
      if (e.key === "Escape") {
        e.preventDefault();
        close();
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        moveActive(1);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        moveActive(-1);
      } else if (e.key === "Enter") {
        e.preventDefault();
        activateActive();
      }
    }

    function allItems() { return $$(".fo-power-palette__item", palette); }

    function moveActive(delta) {
      var items = allItems().filter(function (it) {
        return it.offsetParent !== null;
      });
      if (!items.length) return;
      activeIndex += delta;
      if (activeIndex < 0) activeIndex = items.length - 1;
      if (activeIndex >= items.length) activeIndex = 0;
      items.forEach(function (it, idx) {
        if (idx === activeIndex) it.classList.add("is-active");
        else it.classList.remove("is-active");
      });
      // Scroll into view.
      items[activeIndex].scrollIntoView({ block: "nearest" });
    }

    function activateActive() {
      var items = allItems().filter(function (it) {
        return it.offsetParent !== null;
      });
      var target = items[activeIndex] || items[0];
      if (target) activate(target);
    }

    function activate(item) {
      var action = item.getAttribute("data-fo-action");
      var tab = item.getAttribute("data-fo-tab");
      var url = item.getAttribute("data-fo-url");
      var label = item.getAttribute("data-fo-label") ||
                  item.querySelector(".fo-power-palette__item-label").textContent;
      recordRecent(label, item.getAttribute("data-fo-icon") || "•", url || ("#" + (tab || "")));
      close();
      if (action === "palette") { open(); return; }
      if (action === "shortcuts") { openShortcuts(); return; }
      if (action === "run") { triggerRun(); return; }
      if (action === "save") { triggerSave(); return; }
      if (tab && typeof window.switchTab === "function") {
        window.switchTab(tab);
        return;
      }
      if (url) { navigateTo(url); return; }
    }

    function render(query) {
      var q = (query || "").trim();
      var total = 0;
      $$(".fo-power-palette__group", palette).forEach(function (group) {
        var any = false;
        $$(".fo-power-palette__item", group).forEach(function (item) {
          var label = item.getAttribute("data-fo-label") ||
                      (item.querySelector(".fo-power-palette__item-label") || {}).textContent || "";
          var s = score(q, label);
          if (s > 0) { item.style.display = ""; any = true; total++; }
          else { item.style.display = "none"; }
        });
        group.style.display = any ? "" : "none";
      });
      activeIndex = -1;
      if (count) {
        count.textContent = total === 0
          ? (q ? "No matches" : "")
          : (total + (total === 1 ? " result" : " results"));
      }
      // Auto-select first visible.
      var visible = allItems().filter(function (it) {
        return it.offsetParent !== null;
      });
      if (visible.length) {
        activeIndex = 0;
        visible[0].classList.add("is-active");
      }
      // Empty state.
      var empty = $(".fo-power-palette__empty", palette);
      if (empty) empty.parentNode.removeChild(empty);
      if (total === 0 && q) {
        var div = document.createElement("div");
        div.className = "fo-power-palette__empty";
        div.textContent = "No matches for “" + q + "”.";
        results.appendChild(div);
      }
    }

    input.addEventListener("input", function (e) {
      render(e.target.value);
    });

    $$(".fo-power-palette__item", palette).forEach(function (item) {
      item.addEventListener("click", function () { activate(item); });
    });

    // Global keyboard trigger.
    document.addEventListener("keydown", function (e) {
      var k = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && k === "k") {
        e.preventDefault();
        open();
      }
    });

    // Expose API for jump-to button.
    window.__foPowerPaletteOpen = open;
    window.__foPowerPaletteClose = close;
  }

  // ────────────────────────────────────────────────────────────────────
  // Keyboard shortcuts overlay
  // ────────────────────────────────────────────────────────────────────
  function initShortcuts() {
    var overlay = $("[data-fo-power-shortcuts]");
    var backdrop = $("[data-fo-power-shortcuts-backdrop]");
    if (!overlay || !backdrop) return;
    var closeBtn = $("[data-fo-power-shortcuts-close]");
    function open() {
      overlay.hidden = false;
      backdrop.hidden = false;
      void overlay.offsetWidth;
      overlay.classList.add("is-open");
      backdrop.classList.add("is-open");
      document.addEventListener("keydown", escClose);
    }
    function close() {
      overlay.classList.remove("is-open");
      backdrop.classList.remove("is-open");
      setTimeout(function () {
        overlay.hidden = true;
        backdrop.hidden = true;
      }, 120);
      document.removeEventListener("keydown", escClose);
    }
    function escClose(e) {
      if (e.key === "Escape") { e.preventDefault(); close(); }
    }
    backdrop.addEventListener("click", close);
    if (closeBtn) closeBtn.addEventListener("click", close);
    document.addEventListener("keydown", function (e) {
      var target = e.target;
      if (isEditingTarget(target)) return;
      if (e.key === "?" || (e.shiftKey && e.key === "/")) {
        e.preventDefault();
        open();
      }
    });
    window.__foPowerShortcutsOpen = open;
    window.__foPowerShortcutsClose = close;
  }

  // ────────────────────────────────────────────────────────────────────
  // Quick actions — wire Run / Save to existing endpoints
  // ────────────────────────────────────────────────────────────────────
  function triggerRun() {
    var btn = document.querySelector("[data-fo-run], #run-btn, .run-btn, button[id*='run']");
    if (btn) { btn.click(); return; }
    // Fallback: trigger HTMX POST /run
    var body = document.body;
    if (body && typeof window.htmx !== "undefined") {
      try {
        window.htmx.ajax("POST", "/run", { target: "#panel-pl", swap: "innerHTML" });
      } catch (e) {}
    }
  }
  function triggerSave() {
    var btn = document.querySelector("[data-fo-save], #save-btn, .save-btn, button[id*='save']");
    if (btn) { btn.click(); return; }
  }
  function navigateTo(url) {
    try {
      var u = new URL(url, window.location.origin);
      var pc = getProjectCode();
      if (pc && u.pathname.indexOf("/scenarios") === 0) {
        u.searchParams.set("project", pc);
      }
      window.location.href = u.toString();
    } catch (e) {
      window.location.href = url;
    }
  }

  // ────────────────────────────────────────────────────────────────────
  // Recently edited (sessionStorage-backed)
  // ────────────────────────────────────────────────────────────────────
  var RECENT_KEY = "fo-power-recent-v1";
  function loadRecent() {
    try {
      var raw = sessionStorage.getItem(RECENT_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveRecent(list) {
    try { sessionStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 10))); }
    catch (e) {}
  }
  function recordRecent(label, icon, target) {
    var list = loadRecent();
    list = list.filter(function (it) { return it.target !== target; });
    list.unshift({
      label: label, icon: icon || "•",
      target: target,
      at: new Date().toISOString(),
    });
    saveRecent(list);
    renderRecent();
  }
  function renderRecent() {
    var list = loadRecent();
    var ul = $("[data-fo-power-recent-list]");
    if (!ul) return;
    ul.innerHTML = "";
    if (!list.length) {
      var li = document.createElement("li");
      li.className = "fo-power-recent__empty";
      li.textContent = "No recent activity yet.";
      ul.appendChild(li);
      return;
    }
    list.forEach(function (it) {
      var li = document.createElement("li");
      li.className = "fo-power-recent__item";
      li.tabIndex = 0;
      li.setAttribute("role", "button");
      var ago = humanizeAgo(it.at);
      li.innerHTML =
        '<span class="fo-power-recent__item-icon" aria-hidden="true">' +
          escHtml(it.icon) +
        '</span>' +
        '<span class="fo-power-recent__item-label">' + escHtml(it.label) + '</span>' +
        '<span class="fo-power-recent__item-meta">' + escHtml(ago) + '</span>';
      li.addEventListener("click", function () { activateRecent(it); });
      li.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activateRecent(it); }
      });
      ul.appendChild(li);
    });
  }
  function activateRecent(item) {
    if (!item) return;
    if (item.target && item.target.charAt(0) === "#") {
      var id = item.target.slice(1);
      if (id && typeof window.switchTab === "function") window.switchTab(id);
      return;
    }
    navigateTo(item.target);
  }
  function escHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function humanizeAgo(iso) {
    try {
      var then = new Date(iso).getTime();
      var now = Date.now();
      var s = Math.max(0, Math.round((now - then) / 1000));
      if (s < 60) return s + "s";
      var m = Math.round(s / 60);
      if (m < 60) return m + "m";
      var h = Math.round(m / 60);
      if (h < 24) return h + "h";
      var d = Math.round(h / 24);
      return d + "d";
    } catch (e) { return ""; }
  }

  // Wire clear button.
  function initRecentClear() {
    var btn = $("[data-fo-power-recent-clear]");
    if (!btn) return;
    btn.addEventListener("click", function () {
      try { sessionStorage.removeItem(RECENT_KEY); } catch (e) {}
      renderRecent();
    });
  }

  // Track navigation (recent routes).
  function trackRoute() {
    try {
      var path = window.location.pathname;
      var label = path.replace(/^\//, "") || "Home";
      recordRecent("Open: " + label, "→", window.location.href);
    } catch (e) {}
  }

  // ────────────────────────────────────────────────────────────────────
  // Global sheet shortcuts (Ctrl+1..8, Ctrl+9 scenarios, Ctrl+0 compare)
  // Re-uses window.switchTab (UI-3) for Modeling tabs and HTMX-style
  // navigation for Analysis / Delivery / Storage tabs.
  // ────────────────────────────────────────────────────────────────────
  function initGlobalShortcuts() {
    var sheetMap = {
      "1": "overview", "2": "inputs", "3": "revenue", "4": "opex",
      "5": "capex", "6": "senior-debt", "7": "tax", "8": "pl",
      "9": "scenarios", "0": "scenarios-compare",
    };
    var reportMap = {
      "1": "/scenarios/exec-summary",
      "2": "/scenarios/ic-pack",
      "3": "/scenarios/credit-pack",
      "4": "/scenarios/lender-case",
      "5": "/scenarios/sensitivity",
    };
    document.addEventListener("keydown", function (e) {
      var t = e.target;
      if (isEditingTarget(t)) return;
      // Don't intercept when palette is open.
      if (window.__foPowerPaletteIsOpen && window.__foPowerPaletteIsOpen()) return;

      // Ctrl/Cmd + S → Save
      if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
        e.preventDefault();
        triggerSave();
        return;
      }
      // F9 → Run
      if (e.key === "F9") {
        e.preventDefault();
        triggerRun();
        return;
      }
      // Ctrl/Cmd + 1..0 → sheet switch
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey) {
        var k = e.key;
        if (sheetMap[k]) {
          e.preventDefault();
          if (k === "9") { navigateTo("/scenarios"); return; }
          if (k === "0") { navigateTo("/scenarios/compare"); return; }
          if (typeof window.switchTab === "function") {
            window.switchTab(sheetMap[k]);
          }
          return;
        }
      }
      // Ctrl/Cmd + Shift + 1..5 → report
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && !e.altKey) {
        var kk = e.key;
        if (reportMap[kk]) {
          e.preventDefault();
          navigateTo(reportMap[kk]);
        }
      }
    });
  }

  function paletteOpenStateProvider() {
    var p = document.querySelector("[data-fo-power-palette]");
    return function () { return p && !p.hidden; };
  }

  // ────────────────────────────────────────────────────────────────────
  // Boot
  // ────────────────────────────────────────────────────────────────────
  function boot() {
    try { initPalette(); } catch (e) {}
    try { initShortcuts(); } catch (e) {}
    try { initRecentClear(); } catch (e) {}
    try { initGlobalShortcuts(); } catch (e) {}
    try {
      window.__foPowerPaletteIsOpen = paletteOpenStateProvider();
      renderRecent();
      trackRoute();
    } catch (e) {}
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
