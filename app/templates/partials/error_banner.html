{% if errors %}
<div class="error-banner" id="error-banner" role="alert">
  <div class="error-banner-icon">⚠️</div>
  <div class="error-banner-content">
    {% for err in errors %}
    <div class="error-banner-msg">{{ err }}</div>
    {% endfor %}
  </div>
  <button type="button" class="error-banner-dismiss" onclick="document.getElementById('error-banner').remove()" aria-label="Dismiss">✕</button>
</div>
{% endif %}

<style>
.error-banner {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 0.85rem 1rem;
  background: var(--danger-bg);
  border: 1px solid #fecaca;
  border-radius: var(--radius-sm);
  margin-bottom: 1rem;
  animation: slideDown 0.2s ease;
}

.error-banner-icon {
  font-size: 1rem;
  flex-shrink: 0;
  margin-top: 0.05rem;
}

.error-banner-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

.error-banner-msg {
  font-size: 0.85rem;
  color: #991b1b;
  line-height: 1.4;
}

.error-banner-dismiss {
  background: none;
  border: none;
  font-size: 0.8rem;
  color: #dc2626;
  cursor: pointer;
  flex-shrink: 0;
  padding: 0.1rem 0.3rem;
  border-radius: 4px;
  transition: background 0.1s;
  line-height: 1;
}

.error-banner-dismiss:hover {
  background: #fee2e2;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
