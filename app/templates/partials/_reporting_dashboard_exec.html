<!--
  =======================================================================
  FINCO PROTOCOL — REPORTING DASHBOARD WRAPPER — EXECUTIVE SUMMARY  ·  UI-6
  -----------------------------------------------------------------------
  Renders the V4-5 Part A `exec_summary.html` inside the institutional
  reporting dashboard chrome. No engine / report calculation change.
  =======================================================================
-->
<section class="fo-reporting-dashboard" data-fo-reporting-pack="exec">
  <header class="fo-reporting-dashboard__header">
    <div>
      <h1 class="fo-reporting-dashboard__title">Executive Summary</h1>
      <p class="fo-reporting-dashboard__subtitle">Single-page project snapshot for executive review.</p>
    </div>
    <div class="fo-statements-toolbar">
      <div class="fo-statements-toolbar__group" style="margin-left:auto;">
        <button type="button" class="fo-statements-toolbar__btn"
                onclick="window.print()"
                aria-label="Print executive summary">🖶 Print</button>
        <button type="button" class="fo-statements-toolbar__btn"
                data-fo-pack-export
                aria-label="Export executive summary">⬇ Export</button>
      </div>
    </div>
  </header>

  <article class="fo-reporting-dashboard__card" style="grid-column: 1 / -1;">
    {% include "partials/exec_summary.html" %}
  </article>
</section>
