<style>
  .crypto-subnav{display:flex;gap:6px;padding:8px 24px 0;overflow-x:auto}
  .crypto-subnav a,.crypto-subnav span{padding:6px 10px;border-radius:6px;font-size:11px;text-decoration:none;white-space:nowrap;color:var(--radar-muted,#8d98a5);border:1px solid transparent}
  .crypto-subnav a:hover{color:var(--radar-text,#d7dee5);border-color:var(--radar-border,#303844)}
  .crypto-subnav .is-active{color:var(--radar-text,#f3f6f8);background:rgba(255,255,255,.045);border-color:var(--radar-border,#303844)}
  .crypto-subnav .is-disabled{opacity:.55}
</style>
{% set section = crypto_section|default('overview') %}
<nav class="crypto-subnav" aria-label="Crypto sections">
  <a href="/radar/crypto" class="{% if section == 'overview' %}is-active{% endif %}" {% if section == 'overview' %}aria-current="page"{% endif %}>Overview</a>
  <a href="/radar/crypto/stablecoins" class="{% if section == 'stablecoins' %}is-active{% endif %}" {% if section == 'stablecoins' %}aria-current="page"{% endif %}>Stablecoins</a>
  <a href="/radar/crypto/derivatives" class="{% if section == 'derivatives' %}is-active{% endif %}" {% if section == 'derivatives' %}aria-current="page"{% endif %}>Derivatives</a>
  <span class="is-disabled" aria-disabled="true">RWA · next</span>
</nav>
