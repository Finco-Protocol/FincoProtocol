<style>
  .radar-domain-nav{display:flex;align-items:center;gap:6px;padding:10px 24px;border-bottom:1px solid var(--radar-border,#252b33);background:var(--radar-surface,#11161c);overflow-x:auto}
  .radar-domain-nav a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:7px;font-size:13px;font-weight:650;line-height:1;text-decoration:none;white-space:nowrap;color:var(--radar-muted,#8d98a5);border:1px solid transparent}
  .radar-domain-nav a:hover{color:var(--radar-text,#d7dee5);border-color:var(--radar-border,#303844)}
  .radar-domain-nav .is-active{color:var(--radar-text,#f3f6f8);background:rgba(255,255,255,.055);border-color:var(--radar-border,#303844)}
</style>
{% set domain = radar_domain|default('stocks') %}
<nav class="radar-domain-nav" aria-label="Radar domains" data-testid="radar-domain-nav">
  <a href="/radar" class="{% if domain == 'stocks' %}is-active{% endif %}" {% if domain == 'stocks' %}aria-current="page"{% endif %}>Stocks</a>
  <a href="/radar/crypto" class="{% if domain == 'crypto' %}is-active{% endif %}" {% if domain == 'crypto' %}aria-current="page"{% endif %}>Crypto</a>
  <a href="/radar/economy" class="{% if domain == 'economy' %}is-active{% endif %}" {% if domain == 'economy' %}aria-current="page"{% endif %}>Economy</a>
</nav>
