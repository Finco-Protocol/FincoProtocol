# FINCO Model nginx configuration for app.finco.one
# Place in /etc/nginx/sites-available/finco-web.conf
# Symlink: sudo ln -s /etc/nginx/sites-available/finco-web.conf /etc/nginx/sites-enabled/
# Test:   sudo nginx -t && sudo systemctl reload nginx
#
# Requires:
#   - SSL certificate via certbot at /etc/letsencrypt/live/app.finco.one/
#   - Python app running on 127.0.0.1:8000 (gunicorn)
#   - Static files at /opt/finco_protocol/static/
#
# Domain substitution: replace app.finco.one with your actual domain.
# If you use a different domain, edit ssl_certificate and ssl_certificate_key paths.

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name app.finco.one;

    # Let certbot handle ACME challenge before redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS app server ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name app.finco.one;

    # ── SSL (certbot-managed) ────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/app.finco.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.finco.one/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ────────────────────────────────────────────────────
    # (No extra nginx modules required — pure core headers)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options             "DENY" always;
    add_header X-XSS-Protection            "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/html text/javascript application/javascript application/json application/xml;

    # ── Limits ──────────────────────────────────────────────────────────────
    client_max_body_size 10M;

    # ── Logging ─────────────────────────────────────────────────────────────
    access_log /var/log/nginx/finco-web.access.log;
    error_log  /var/log/nginx/finco-web.error.log;

    # ── Static files (CSS, JS, images) ──────────────────────────────────────
    location /static/ {
        alias /opt/finco_protocol/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── FINCO Model Web App → gunicorn on :8000 ───────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_redirect     off;

        proxy_connect_timeout  60s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers     8 4k;
    }
}