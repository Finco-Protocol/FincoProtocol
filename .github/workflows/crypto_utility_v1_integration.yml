name: Crypto Utility V1 Integration

on:
  pull_request:
    paths:
      - "app/crypto_*.py"
      - "app/yield_alerts_gateway.py"
      - "app/protocol/**"
      - "app/protocol_ui/**"
      - "app/templates/partials/_protocol_nav.html"
      - "app/templates/crypto/**"
      - "app/templates/protocol_home.html"
      - "app/templates/protocol_roadmap.html"
      - "app/templates/yield/**"
      - "finco_yield/**"
      - "docs/ROADMAP.md"
      - "docs/FINCO_TOKEN_ACTIVATION_RUNBOOK.md"
      - "main_web.py"
      - "tests/test_correction_b_home_claims.py"
      - "tests/test_opus_a1_public_truth.py"
      - "tests/test_opus_c1_product_truth.py"
      - "tests/test_p1_release_truth.py"
      - "tests/test_product_capability_consistency.py"
      - "tests/test_protocol_roadmap.py"
      - "tests/test_public_product_truth_sync.py"
      - "tests/test_yield_alerts_core.py"
      - "tests/test_yield_watchlist.py"
      - "tests/test_crypto_ux_v1.py"
      - "tests/test_crypto_access_presentation.py"
      - "tests/test_yield_gating_v0.py"
      - "tests/test_finco_token_activation_readiness.py"
      - "tests/test_crypto_roadmap_q4_q1.py"
      - "tests/test_staging_product_truth.py"
      - "tests/test_crypto_utility_v1_integration.py"
      - "tests/test_crypto_productization_final.py"
      - ".github/workflows/crypto_utility_v1_integration.yml"
      - "requirements.txt"
      - "constraints.txt"
      - "pytest.ini"

permissions:
  contents: read

jobs:
  focused-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          python -m pip check

      - name: Run inherited Product Truth regression set
        run: |
          pytest -q \
            tests/test_correction_b_home_claims.py \
            tests/test_opus_a1_public_truth.py \
            tests/test_opus_c1_product_truth.py \
            tests/test_p1_release_truth.py \
            tests/test_product_capability_consistency.py \
            tests/test_protocol_roadmap.py \
            tests/test_public_product_truth_sync.py \
            tests/test_staging_product_truth.py \
            tests/test_crypto_roadmap_q4_q1.py

      - name: Run Crypto Utility V1 focused suites
        run: |
          pytest -q \
            tests/test_yield_alerts_core.py \
            tests/test_yield_watchlist.py \
            tests/test_crypto_ux_v1.py \
            tests/test_crypto_access_presentation.py \
            tests/test_yield_gating_v0.py \
            tests/test_finco_token_activation_readiness.py \
            tests/test_crypto_roadmap_q4_q1.py \
            tests/test_staging_product_truth.py \
            tests/test_crypto_utility_v1_integration.py \
            tests/test_crypto_productization_final.py
