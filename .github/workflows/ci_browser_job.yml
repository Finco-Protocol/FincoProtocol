name: CI Browser Test Job

on:
  workflow_call:
    inputs:
      role:
        type: string
        required: true
      tested-sha:
        type: string
        required: true
      artifact-prefix:
        type: string
        default: browser

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    continue-on-error: false # targeted F3 must report its own failure, never an apparent pass
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tested-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Exact-head source attestation
        run: python -m tools.ci_acceptance attest --expected '${{ inputs.tested-sha }}' --output artifacts/source.json
      - name: Install and attest dependency preparation
        run: |
          python -m tools.ci_acceptance run --expected '${{ inputs.tested-sha }}' --label install --output artifacts/install.json -- \
            bash -e -c 'python -m pip install --upgrade pip; pip install -r requirements.txt -c constraints.txt; python -m pip check; pip install playwright==1.63.0; python -m pip check'
      # Exact version used by accepted run 38120169524; no production deps change.
      - name: Cache version-bound Chromium binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-ubuntu24-py312-pw1.63.0
      - name: Install Chromium and OS dependencies even on cache hits
        run: python -m tools.ci_acceptance run --expected '${{ inputs.tested-sha }}' --label chromium --output artifacts/chromium.json -- playwright install chromium --with-deps
      - name: Existing mandatory browser selection
        if: inputs.role != 'f3'
        env:
          FINCO_CI_PYTEST_BUDGET_S: '1200'
          FINCO_CI_EXIT_GRACE_S: '180'
          FINCO_CI_DIAG_PATH: artifacts/ci-hang-diagnostics.txt
        run: python -m tools.ci_browser_job '${{ inputs.role }}' --expected '${{ inputs.tested-sha }}'
      - name: Check out immutable F3 equivalence base
        if: inputs.role == 'f3'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2e199bc3fb8e7a5971e26d1a1a48e9875a63045d
          path: f3-base
          persist-credentials: false
      - name: Optional F3 evidence with explicit process result
        if: inputs.role == 'f3'
        env:
          FINCO_PR_HEAD_SHA: ${{ inputs.tested-sha }}
        run: |
          python -m tools.ci_acceptance run --expected '${{ inputs.tested-sha }}' --label f3 --output artifacts/f3-process.json -- \
            python -m tools.model_financing_f3_evidence_bundle --out artifacts/f3-evidence --base-checkout "$GITHUB_WORKSPACE/f3-base"
      # Maintain the accepted #248 reviewer-facing exact-head artifact alias.
      - name: Upload workspace consolidation screenshots
        if: always() && inputs.role == 'consolidation' && inputs.artifact-prefix == 'browser'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-workspace-consolidation-browser
          path: artifacts/workspace-consolidation/
          if-no-files-found: error
      - name: Upload role-specific evidence and timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.artifact-prefix }}-${{ inputs.role }}
          path: artifacts/
          if-no-files-found: error
