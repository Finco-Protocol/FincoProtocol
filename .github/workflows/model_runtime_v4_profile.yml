name: Model Runtime V4 Profile

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/model_runtime_v4_probe.py"
      - "financial_engine/**"
      - "app/runtime/**"
      - "app/services/production_financial_authority.py"
      - ".github/workflows/model_runtime_v4_profile.yml"

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          python -m pip check
      - name: Profile canonical runtime
        env:
          FINCO_MODEL_WORKERS: "2"
        run: python tools/model_runtime_v4_probe.py
