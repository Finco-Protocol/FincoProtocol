name: Protocol Verification Corpus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  protocol-verification:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install constrained application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          python -m pip check

      - name: Compile verification package
        run: python -m compileall -q finco_protocol

      - name: Focused verification tests
        run: pytest -q tests/test_protocol_verification.py

      - name: Build corpus twice and prove byte reproducibility
        run: |
          mkdir -p artifacts
          python tools/build_public_validation_corpus.py --output artifacts/corpus-a.json
          python tools/build_public_validation_corpus.py --output artifacts/corpus-b.json
          cmp artifacts/corpus-a.json artifacts/corpus-b.json
          mv artifacts/corpus-a.json artifacts/finco-public-validation-corpus.json
          rm artifacts/corpus-b.json

      - name: Public repository safety scan
        run: python tools/public_safety_scan.py

      - name: Upload verification corpus evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finco-public-validation-corpus
          path: artifacts/finco-public-validation-corpus.json
          if-no-files-found: error
