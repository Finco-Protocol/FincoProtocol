name: Radar R1 Canonical Asset Registry

on:
  push:
    branches: [radar/r1-canonical-asset-registry]
    paths:
      - "finco_radar/**"
      - "tests/test_radar_r1_registry.py"
      - "docs/radar/r1_canonical_asset_registry.md"
      - ".github/workflows/radar_r1_asset_registry.yml"
  workflow_dispatch:

jobs:
  canonical-asset-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Radar runtime dependencies
        run: python -m pip install "httpx>=0.27,<1"
      - name: Run R1 canonical registry live proof
        run: python -m finco_radar.r1.live_proof
      - name: Require canonical identity invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/radar_r1_canonical_asset_registry.json").read_text())
          if data["status"] != "PASS":
              raise SystemExit("R1_BLOCKED: live proof not PASS")
          # Constructor-invariant regression guards: a successful snapshot must remain one-to-one.
          if data["assetCount"] != data["assetUidCount"]:
              raise SystemExit("R1_BLOCKED: asset uid uniqueness failed")
          if data["deploymentCount"] != data["canonicalKeyCount"]:
              raise SystemExit("R1_BLOCKED: canonical deployment uniqueness failed")
          selected_key = str(data["selected"]["canonicalKey"])
          reference = data["referenceBinding"]
          if reference["canonicalKey"] != selected_key:
              raise SystemExit("R1_BLOCKED: reference binding changed selected canonical key")
          if reference["matchedCanonicalKey"] != reference["canonicalKey"]:
              raise SystemExit("R1_BLOCKED: reference response did not match canonical deployment")
          if selected_key not in reference["referenceDeploymentKeys"]:
              raise SystemExit("R1_BLOCKED: canonical key absent from reference deployment evidence")
          if not selected_key.startswith("4663:0x"):
              raise SystemExit("R1_BLOCKED: selected asset lacks Robinhood Chain canonical key")
          print(
              "R1_CANONICAL_REGISTRY_PASS "
              f"assets={data['assetCount']} keys={data['canonicalKeyCount']} "
              f"selected={selected_key} matched={reference['matchedCanonicalKey']}"
          )
          PY
      - name: Run R0 execution quote regression alongside R1
        env:
          RADAR_R0_EVIDENCE_PATH: artifacts/radar_r0_regression_on_r1.json
        run: python -m finco_radar.r0.live_proof
      - name: Require full R0 size-aware acceptance regression
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          data = json.loads(Path("artifacts/radar_r0_regression_on_r1.json").read_text())
          if data["status"] != "PASS":
              raise SystemExit("R0_REGRESSION_BLOCKED: live proof not PASS")
          buy = Decimal(data["sizeImpactBps"]["BUY"])
          sell = Decimal(data["sizeImpactBps"]["SELL"])
          if buy == 0 and sell == 0:
              raise SystemExit("R0_REGRESSION_BLOCKED: no size-dependent quote economics observed")
          print(f"R0_SIZE_AWARE_REGRESSION_PASS BUY={buy}bps SELL={sell}bps")
          PY
      - name: Upload R1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-r1-canonical-asset-registry-evidence
          path: |
            artifacts/radar_r1_canonical_asset_registry.json
            artifacts/radar_r0_regression_on_r1.json
          if-no-files-found: error
