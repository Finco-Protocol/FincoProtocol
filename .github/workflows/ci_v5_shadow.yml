# CI V5 SHADOW (observational) - NOT REQUIRED, never satisfies or replaces any required check ("CI V4 gate" stays authoritative).
# Split by TRUST BOUNDARY (V5-2B):
#   verdict  : Git OBJECTS only. Evaluator + B5 come from the trusted BASE (git archive of the protected branch tip); no PR-head script, Python, plugin or
#              imported module runs here. If the trusted base has no V5-2B evaluator yet (the transition PR), the head's copy is used and the verdict is
#              honestly labelled UNTRUSTED_TOOL_SOURCE (it can never be an integrity pass).
#   v4       : the accepted V4 central governance gate. It executes PR-head Python, so it is isolated in its own job and judges nothing.
#   compare  : trusted-base code only; reads the two artifacts as DATA and writes the comparison + job summary.
# The PR comparison remains read-only, with no secrets and no privileged PR trigger. A future authoritative lane needs an
# immutable organization-required workflow or a reviewed privileged trigger; neither is introduced here (docs/ci_v5/README.md, owner steps).
# Delete this single file to remove V5 shadow entirely; V4 is untouched.
name: CI V5 shadow (not required)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-v5-shadow-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verdict:
    name: v5-verdict (git objects only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve the trusted tip and trusted tools (archived from the base tip; nothing is read from the PR head unless the base has no evaluator)
        id: tools
        run: |
          set -euo pipefail
          TIP="$(git rev-parse --verify refs/remotes/origin/main^{commit})"
          TRUSTED="$RUNNER_TEMP/trusted_v5"
          mkdir -p "$TRUSTED"
          FILES="tools/ci_v5_epoch.py tools/ci_v5_b5.py tools/ci_v5_shadow.py tools/ci_perf_guard.py tests/ci_v4_lean_report.py"
          if git show "$TIP:tools/ci_v5_epoch.py" 2>/dev/null | grep -q "FINCO_CI_V5_DELTA_V2" && git cat-file -e "$TIP:tests/ci_v4_lean_report.py" 2>/dev/null; then
            git archive "$TIP" $FILES | tar -x -C "$TRUSTED"
            echo "provenance=TRUSTED_BASE" >> "$GITHUB_OUTPUT"
          else
            git archive "$HEAD_SHA" $FILES | tar -x -C "$TRUSTED"
            echo "provenance=UNTRUSTED_TOOL_SOURCE" >> "$GITHUB_OUTPUT"
          fi
          echo "tip=$TIP" >> "$GITHUB_OUTPUT"
          echo "dir=$TRUSTED" >> "$GITHUB_OUTPUT"
      - name: V5 verdict (no checkout code is executed)
        env:
          TOOLS_DIR: ${{ steps.tools.outputs.dir }}
          PROVENANCE: ${{ steps.tools.outputs.provenance }}
          TIP: ${{ steps.tools.outputs.tip }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -I "$TOOLS_DIR/tools/ci_v5_shadow.py" verdict --repo . --head-sha "$HEAD_SHA" --base-tip-sha "$TIP" \
            --out-dir "$RUNNER_TEMP/ci_v5_verdict" --b3-report "$TOOLS_DIR/tests/ci_v4_lean_report.py" --tools-provenance "$PROVENANCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-v5-verdict-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ci_v5_verdict
          if-no-files-found: warn
          retention-days: 14
  v4-comparison:
    name: v4-comparison (runs PR-head code, isolated)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run the accepted V4 central governance gate (PR-head code; result is an artifact, never a verdict of this job)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/ci_v5_shadow.py v4 --repo . --head-sha "$HEAD_SHA" --out-dir "$RUNNER_TEMP/ci_v5_v4"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-v5-v4gate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ci_v5_v4
          if-no-files-found: warn
          retention-days: 14
  compare:
    name: compare (trusted code, artifacts as data)
    needs: [verdict, v4-comparison]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve trusted tools (archived from the base tip; the head's copy only when the base has no V5-2B evaluator)
        id: tools
        run: |
          set -euo pipefail
          TIP="$(git rev-parse --verify refs/remotes/origin/main^{commit})"
          TRUSTED="$RUNNER_TEMP/trusted_v5"
          mkdir -p "$TRUSTED"
          FILES="tools/ci_v5_epoch.py tools/ci_v5_b5.py tools/ci_v5_shadow.py tools/ci_perf_guard.py"
          if git show "$TIP:tools/ci_v5_epoch.py" 2>/dev/null | grep -q "FINCO_CI_V5_DELTA_V2"; then
            git archive "$TIP" $FILES | tar -x -C "$TRUSTED"
            echo "provenance=TRUSTED_BASE" >> "$GITHUB_OUTPUT"
          else
            git archive "$HEAD_SHA" $FILES | tar -x -C "$TRUSTED"
            echo "provenance=UNTRUSTED_TOOL_SOURCE" >> "$GITHUB_OUTPUT"
          fi
          echo "dir=$TRUSTED" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: ci-v5-verdict-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/in_verdict
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: ci-v5-v4gate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/in_v4
      - name: Compare (data only) and write the job summary
        env:
          TOOLS_DIR: ${{ steps.tools.outputs.dir }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/in_verdict" "$RUNNER_TEMP/in_v4"
          python -I "$TOOLS_DIR/tools/ci_v5_shadow.py" compare --head-sha "$HEAD_SHA" --verdict-dir "$RUNNER_TEMP/in_verdict" \
            --v4-dir "$RUNNER_TEMP/in_v4" --out-dir "$RUNNER_TEMP/ci_v5_out" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-v5-shadow-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ci_v5_out
          if-no-files-found: warn
          retention-days: 14
  runtime-benchmark:
    name: Whole-module runtime (${{ matrix.module }})
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/post468-full-closure'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [fin_v2_integration_409_scope, fin_v2_wf06a_scope, finance_integrity_governance]
    env:
      BASE_SHA: 305b3553536680e567c608e4ebd3b166ef3d32a7
      TEST_MODULE: tests/test_${{ matrix.module }}.py
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Compare both exact trees on the same runner
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/runtime-benchmark"
          mkdir "$out"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --exit-code "$BASE_SHA" HEAD -- requirements.txt requirements-ci-tests.txt constraints.txt pytest.ini
          git worktree add --detach "$RUNNER_TEMP/runtime-base" "$BASE_SHA"
          python -m pip install -r requirements.txt -r requirements-ci-tests.txt -c constraints.txt
          lscpu > "$out/runner-cpu.txt"
          python -m pip freeze > "$out/dependencies.txt"
          python -c 'from tools.ci_full_parallel import RECORDER_SOURCE; print(RECORDER_SOURCE)' > "$out/finco_benchmark_recorder.py"
          run_module() (
            mode="$1"
            cd "$2"
            git log -1 --format='%H %T' > "$out/$mode.source"
            export PYTHONPATH="$PWD:$out" FINCO_CI_FULL_RECORDER="$out/$mode.phases.json"
            if [[ "$mode" == optimized && "$TEST_MODULE" == tests/test_finance_integrity_governance.py ]]; then
              export FINCO_CI_FULL_SCOPED_NODES='tests/test_finance_integrity_governance.py::test_stream_guard_exemption_covers_only_allow_listed_engine_files'
            fi
            python -m pytest -p finco_benchmark_recorder "$TEST_MODULE" --junitxml="$out/$mode.xml" --durations=0
          )
          run_module optimized "$GITHUB_WORKSPACE"
          run_module plain "$RUNNER_TEMP/runtime-base"
          python - "$out" <<'PY'
          import json
          import sys
          from pathlib import Path
          out = Path(sys.argv[1])
          a, b = (json.loads((out / f'{mode}.phases.json').read_text()) for mode in ('plain', 'optimized'))
          assert a['nodes'].keys() == b['nodes'].keys() and a['nodes']
          for run in (a, b):
              assert run['complete'] and run['exitstatus'] == 0
              for node in run['nodes'].values():
                  assert node['phases'] == dict.fromkeys(('setup', 'call', 'teardown'), 'passed')
              print(f"{len(run['nodes'])} passed nodes, {sum(n['duration'] for n in run['nodes'].values()):.3f}s total phase time")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: whole-module-runtime-${{ matrix.module }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-benchmark/
          if-no-files-found: error
