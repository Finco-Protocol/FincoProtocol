# CI V5 shadow (observational, NOT required) + the V5-3 gate (a candidate required check, NOT yet required by any GitHub setting).
# Split by TRUST BOUNDARY:
#   verdict  : Git OBJECTS only. Evaluator + B5 come from the trusted BASE (git archive of the protected branch tip); no PR-head script, Python, plugin or
#              imported module runs here. If the trusted base has no V2 evaluator, the head's copy is used and the verdict is honestly labelled
#              UNTRUSTED_TOOL_SOURCE (it can never be an integrity pass).
#   v4       : the accepted V4 central governance gate. It executes PR-head Python, so it is isolated in its own job and judges nothing.
#   compare  : trusted-base code only; reads the two artifacts as DATA and writes the comparison + job summary.
#   gate     : (pull_request_target) the production candidate. For this event GitHub reads THIS FILE FROM THE PROTECTED BASE BRANCH, not from the pull
#              request, so a PR cannot rewrite the gate that judges it. It checks out the BASE, fetches the PR head as Git OBJECTS ONLY (never checks it out,
#              never executes anything from it), has read-only permissions and no secrets, and reads reviews and check runs itself from the API.
#              It blocks unless integrity, an independent authorization at the exact head and (for a semantic deferral) the same head's V4 checks all hold.
# The three shadow jobs stay `on: pull_request` (a PR can edit them) and never gate anything. The gate is only a REQUIRED check once the owner adds its name
# in GitHub settings AFTER this file is on the protected branch; a green run of it is not evidence of enforcement (docs/ci_v5/OWNER_POSTMERGE_ACTIVATION_CHECKLIST.md).
# Delete this single file to remove V5 shadow and the gate entirely; V4 is untouched.
name: CI V5 shadow (not required) and gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-v5-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verdict:
    name: v5-verdict (git objects only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve the trusted tip and trusted tools (archived from the base tip; nothing is read from the PR head unless the base has no evaluator)
        id: tools
        run: |
          set -euo pipefail
          TIP="$(git rev-parse --verify refs/remotes/origin/main^{commit})"
          TRUSTED="$RUNNER_TEMP/trusted_v5"
          mkdir -p "$TRUSTED"
          FILES="tools/ci_v5_epoch.py tools/ci_v5_b5.py tools/ci_v5_shadow.py tests/ci_v4_lean_report.py"
          if git show "$TIP:tools/ci_v5_epoch.py" 2>/dev/null | grep -q "FINCO_CI_V5_DELTA_V2" && git cat-file -e "$TIP:tests/ci_v4_lean_report.py" 2>/dev/null; then
            git archive "$TIP" $FILES | tar -x -C "$TRUSTED"
            echo "provenance=TRUSTED_BASE" >> "$GITHUB_OUTPUT"
          else
            git archive "$HEAD_SHA" $FILES | tar -x -C "$TRUSTED"
            echo "provenance=UNTRUSTED_TOOL_SOURCE" >> "$GITHUB_OUTPUT"
          fi
          echo "tip=$TIP" >> "$GITHUB_OUTPUT"
          echo "dir=$TRUSTED" >> "$GITHUB_OUTPUT"
      - name: V5 verdict (no checkout code is executed)
        env:
          TOOLS_DIR: ${{ steps.tools.outputs.dir }}
          PROVENANCE: ${{ steps.tools.outputs.provenance }}
          TIP: ${{ steps.tools.outputs.tip }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -I "$TOOLS_DIR/tools/ci_v5_shadow.py" verdict --repo . --head-sha "$HEAD_SHA" --base-tip-sha "$TIP" \
            --out-dir "$RUNNER_TEMP/ci_v5_verdict" --b3-report "$TOOLS_DIR/tests/ci_v4_lean_report.py" --tools-provenance "$PROVENANCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-v5-verdict-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ci_v5_verdict
          if-no-files-found: warn
          retention-days: 14
  v4-comparison:
    name: v4-comparison (runs PR-head code, isolated)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run the accepted V4 central governance gate (PR-head code; result is an artifact, never a verdict of this job)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/ci_v5_shadow.py v4 --repo . --head-sha "$HEAD_SHA" --out-dir "$RUNNER_TEMP/ci_v5_v4"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-v5-v4gate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ci_v5_v4
          if-no-files-found: warn
          retention-days: 14
  compare:
    name: compare (trusted code, artifacts as data)
    needs: [verdict, v4-comparison]
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve trusted tools (archived from the base tip; the head's copy only when the base has no V5-2B evaluator)
        id: tools
        run: |
          set -euo pipefail
          TIP="$(git rev-parse --verify refs/remotes/origin/main^{commit})"
          TRUSTED="$RUNNER_TEMP/trusted_v5"
          mkdir -p "$TRUSTED"
          FILES="tools/ci_v5_epoch.py tools/ci_v5_b5.py tools/ci_v5_shadow.py"
          if git show "$TIP:tools/ci_v5_epoch.py" 2>/dev/null | grep -q "FINCO_CI_V5_DELTA_V2"; then
            git archive "$TIP" $FILES | tar -x -C "$TRUSTED"
            echo "provenance=TRUSTED_BASE" >> "$GITHUB_OUTPUT"
          else
            git archive "$HEAD_SHA" $FILES | tar -x -C "$TRUSTED"
            echo "provenance=UNTRUSTED_TOOL_SOURCE" >> "$GITHUB_OUTPUT"
          fi
          echo "dir=$TRUSTED" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: ci-v5-verdict-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/in_verdict
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: ci-v5-v4gate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/in_v4
      - name: Compare (data only) and write the job summary
        env:
          TOOLS_DIR: ${{ steps.tools.outputs.dir }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/in_verdict" "$RUNNER_TEMP/in_v4"
          python -I "$TOOLS_DIR/tools/ci_v5_shadow.py" compare --head-sha "$HEAD_SHA" --verdict-dir "$RUNNER_TEMP/in_verdict" \
            --v4-dir "$RUNNER_TEMP/in_v4" --out-dir "$RUNNER_TEMP/ci_v5_out" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-v5-shadow-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ci_v5_out
          if-no-files-found: warn
          retention-days: 14
  gate:
    name: V5 gate (trusted base)
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      pull-requests: read
      checks: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch the PR head as Git OBJECTS ONLY and resolve the trusted tip (nothing from the head is checked out or executed)
        id: refs
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          TIP="$(git rev-parse --verify refs/remotes/origin/main^{commit})"
          # the tools are this checkout (the protected base); they are trusted only if it is accepted history of the tip and already has the V2 evaluator
          if git merge-base --is-ancestor HEAD "$TIP" && grep -q "FINCO_CI_V5_DELTA_V2" tools/ci_v5_epoch.py; then PROVENANCE=TRUSTED_BASE; else PROVENANCE=UNTRUSTED_TOOL_SOURCE; fi
          echo "tip=$TIP" >> "$GITHUB_OUTPUT"
          echo "provenance=$PROVENANCE" >> "$GITHUB_OUTPUT"
      - name: Gate (reviews and check runs are read by this trusted job; a V4-deferral waits, bounded, for the same head's V4 checks)
        env:
          TIP: ${{ steps.refs.outputs.tip }}
          PROVENANCE: ${{ steps.refs.outputs.provenance }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/ci_v5_gate"
          mkdir -p "$OUT"
          fetch() {
            gh api --paginate --jq '.[]' "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" | jq -s '.' > "$OUT/reviews.json" || echo '[]' > "$OUT/reviews.json"
            gh api --paginate --jq '.check_runs[]' "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" | jq -s '.' > "$OUT/check_runs.json" || echo '[]' > "$OUT/check_runs.json"
          }
          run_gate() {
            python -I tools/ci_v5_shadow.py gate --repo . --head-sha "$HEAD_SHA" --head-ref refs/remotes/pr/head --base-tip-sha "$TIP" --pr-author "$PR_AUTHOR" \
              --reviews-json "$OUT/reviews.json" --check-runs-json "$OUT/check_runs.json" --tools-provenance "$PROVENANCE" --out-dir "$OUT" --summary "$GITHUB_STEP_SUMMARY"
          }
          DEADLINE=$(( $(date +%s) + 5400 ))
          fetch
          run_gate; RC=$?
          while [ "$RC" -ne 0 ] && grep -q "DEFERRAL_NEEDS_V4_VERIFIED_AT_THE_SAME_HEAD" "$OUT/gate_decision.json" && [ "$(date +%s)" -lt "$DEADLINE" ]; do
            sleep 120
            fetch
            run_gate; RC=$?
          done
          exit "$RC"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-v5-gate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ci_v5_gate
          if-no-files-found: warn
          retention-days: 14
