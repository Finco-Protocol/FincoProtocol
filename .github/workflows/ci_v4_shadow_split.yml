# CI V4 SHADOW node-split benchmark - NOT REQUIRED, never satisfies or replaces "CI V4 gate".
# Runs the HEAD node-split code (collection -> node plan -> shards -> independent re-collection + aggregation) on a FIXED list of heavy
# governance modules at the exact PR head SHA, plus a disk-vs-tmpfs calibration. Read-only token, no secrets, no deployment, no write.
# The required CI V4 PR gate keeps the trusted-base selector and aggregator; node splitting stays OFF there (docs/ci_v4/node_split_policy.json).
name: CI V4 shadow split benchmark (not required)
on:
  pull_request:
    paths:
      - 'tools/ci_v4_nodes.py'
      - 'tools/ci_v4_shard.py'
      - 'tools/ci_v4_aggregate.py'
      - 'tools/ci_v4_schedule.py'
      - 'docs/ci_v4/node_split_policy.json'
      - 'docs/ci_v4/node_weights.json'
      - '.github/workflows/ci_v4_shadow_split.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-v4-shadow-split-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  SHADOW_MODULES: tests/test_wf06b_scope.py tests/test_rcux_governance.py tests/test_u1_scope.py tests/test_post413_o1_scope.py
jobs:
  shadow-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci-tests.txt
            constraints.txt
      - name: Install (same Python runtime as the CI V4 shards)
        run: |
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-ci-tests.txt -c constraints.txt
      - name: Collect the exact node inventory and build the labelled shadow node plan
        id: plan
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shadow"
          python -m tools.ci_v4_nodes collect --output "$RUNNER_TEMP/shadow/inventory.json" $SHADOW_MODULES
          python -m tools.ci_v4_nodes plan --inventory "$RUNNER_TEMP/shadow/inventory.json" --tier risk --output "$RUNNER_TEMP/shadow/ci-v4-plan.json" $SHADOW_MODULES
          python - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json, os
          p = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'shadow', 'ci-v4-plan.json')))
          print('matrix=' + json.dumps({'index': list(range(len(p['schedule']['shards'])))}))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-v4-shadow-plan
          path: ${{ runner.temp }}/shadow/
          if-no-files-found: error
  shadow-shards:
    needs: shadow-plan
    runs-on: ubuntu-24.04
    # Benchmark ceiling: the indivisible wf06b floor node alone took 6718 s on #420; a cancelled shard is reported as censored, not as a sample.
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shadow-plan.outputs.matrix) }}
    name: shadow-shard-${{ matrix.index }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci-tests.txt
            constraints.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-v4-shadow-plan
          path: ${{ runner.temp }}/shadow/plan
      # The shadow modules are git/governance tests; frontend node_modules are not installed (an import of it would fail loudly, never skip).
      - name: Install (Python only)
        run: |
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-ci-tests.txt -c constraints.txt
      - name: Runner facts (cores, memory, tmpfs capacity)
        run: |
          nproc; free -m; df -h /dev/shm "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - name: Run the shadow shard (exact node ids; tmp_path/worktrees on verified tmpfs, disk fallback)
        run: python -m tools.ci_v4_shard --plan "$RUNNER_TEMP/shadow/plan/ci-v4-plan.json" --index ${{ matrix.index }} --output "$RUNNER_TEMP/shadow/out" --tmp auto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-v4-shadow-shard-${{ matrix.index }}
          path: ${{ runner.temp }}/shadow/out/
          if-no-files-found: error
  shadow-calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci-tests.txt
            constraints.txt
      - name: Install
        run: |
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-ci-tests.txt -c constraints.txt
      - name: Same SHA, same code - cohort composite cost on the disk checkout vs an exact clone on tmpfs
        run: |
          mkdir -p "$RUNNER_TEMP/calibrate"
          nproc; free -m; df -h /dev/shm
          python -m tools.ci_v4_nodes calibrate --output "$RUNNER_TEMP/calibrate/calibrate.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-v4-shadow-calibrate
          path: ${{ runner.temp }}/calibrate/
          if-no-files-found: warn
  shadow-verify:
    name: CI V4 shadow split verify (NOT REQUIRED)
    if: always() && needs.shadow-plan.result == 'success'
    needs: [shadow-plan, shadow-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci-tests.txt
            constraints.txt
      - name: Install
        run: |
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-ci-tests.txt -c constraints.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-v4-shadow-plan
          path: ${{ runner.temp }}/ev/plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ci-v4-shadow-shard-*
          path: ${{ runner.temp }}/ev/shards
      - name: Independent re-collection in THIS job, then exact node coverage (collected == disjoint union of executed)
        run: |
          set -euo pipefail
          python -m tools.ci_v4_nodes collect --output "$RUNNER_TEMP/ev/independent-inventory.json" $SHADOW_MODULES
          python -m tools.ci_v4_aggregate --plan "$RUNNER_TEMP/ev/plan/ci-v4-plan.json" --shards "$RUNNER_TEMP/ev/shards" --junit "$RUNNER_TEMP/ev/shards" \
            --inventory "$RUNNER_TEMP/ev/independent-inventory.json" --output "$RUNNER_TEMP/ev/result"
      - name: Summary (SHADOW - not required)
        if: always()
        run: |
          python - <<'PYCODE' >> "$GITHUB_STEP_SUMMARY"
          import json, os, glob
          t = os.environ['RUNNER_TEMP']
          print('## CI V4 SHADOW node-split benchmark - NOT REQUIRED (never satisfies CI V4 gate)')
          try:
              r = json.load(open(t + '/ev/result/ci-v4-result.json')); p = json.load(open(t + '/ev/plan/ci-v4-plan.json'))
          except OSError as e:
              print('no aggregate result: %s' % e); raise SystemExit
          print('verdict %s; executed nodes %d; counts %s' % (r['verdict'], r['executed_nodes'], r['counts']))
          print('workers %d; predicted critical path %ss; actual slowest shard %ss; shard runner-minutes %s' % (
              r['workers'], p['schedule']['predicted_critical_path_s'], r['actual_critical_path_s'], r['actual_runner_minutes']))
          for f in sorted(glob.glob(t + '/ev/shards/**/shard-*.json', recursive=True)):
              s = json.load(open(f)); print('- shard %s: wall %ss, tmp %s, units %d' % (s['shard'], s['wall_s'], s['tmp'].get('mode'), len(s.get('units', []))))
          for x in r['problems']: print('- PROBLEM: ' + x)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-v4-shadow-result
          path: |
            ${{ runner.temp }}/ev/result/
            ${{ runner.temp }}/ev/independent-inventory.json
          if-no-files-found: warn
