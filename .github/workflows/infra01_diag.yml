name: INFRA-01 diagnostic (scratch, read-only, never a required check)
on:
  push:
    branches: [ci/infra-01-diag-scratch]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        probe: [a, b, c]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unchanged production command (as in the three workflows)
        run: |
          date -u; getent hosts azure.archive.ubuntu.com | head -n 1 || echo "NO RESOLUTION"
          python -m pip install playwright==1.63.0
          time playwright install chromium --with-deps
      - name: Real Chromium launch
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page(); pg.set_content("<h1>ok</h1>"); print(pg.inner_text("h1"), b.version); b.close()
          PY
