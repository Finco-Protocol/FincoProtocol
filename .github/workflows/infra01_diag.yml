name: INFRA-01 diagnostic (scratch, read-only, never a required check)
on:
  push:
    branches: [ci/infra-01-diag-scratch]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Runner, resolver and apt source facts
        run: |
          set +e
          date -u; uname -a; grep -E '^(NAME|VERSION)=' /etc/os-release; echo "image: $ImageOS $ImageVersion"
          echo '--- resolv.conf'; cat /etc/resolv.conf
          echo '--- resolvectl'; resolvectl status 2>&1 | head -n 30
          echo '--- apt-mirrors.txt'; cat /etc/apt/apt-mirrors.txt 2>&1
          echo '--- ubuntu.sources'; cat /etc/apt/sources.list.d/ubuntu.sources 2>&1 | head -n 30
          echo '--- other sources'; ls /etc/apt/sources.list.d/
      - name: DNS and HTTP reachability per host
        run: |
          set +e
          for h in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com ports.ubuntu.com packages.microsoft.com cdn.playwright.dev playwright.download.prss.microsoft.com registry-1.docker.io pypi.org github.com; do
            printf '%-46s getent: ' "$h"; getent hosts "$h" | head -n 1 | tr '\n' ' '; echo
            printf '%-46s https : ' "$h"; curl -sS -o /dev/null -m 15 -w '%{http_code} ip=%{remote_ip} t=%{time_total}\n' "https://$h/" 2>&1 | tail -n 1
          done
          echo '--- official archive InRelease'
          for u in http://azure.archive.ubuntu.com/ubuntu http://archive.ubuntu.com/ubuntu https://archive.ubuntu.com/ubuntu http://security.ubuntu.com/ubuntu; do
            printf '%-48s ' "$u"; curl -sS -o /dev/null -m 20 -w '%{http_code}\n' "$u/dists/noble/InRelease" 2>&1 | tail -n 1
          done
      - name: apt-get update with the runner's default sources (reproduction)
        run: |
          set +e
          sudo apt-get update -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 2>&1 | tail -n 40
          echo "apt-get update exit=${PIPESTATUS[0]}"
      - name: apt-get update against the OFFICIAL archive only (signed-by, isolated, non-destructive)
        run: |
          set +e
          mkdir -p /tmp/diag-apt/lists/partial /tmp/diag-apt/sources.d
          cat > /tmp/diag-apt/sources.d/ubuntu-official.sources <<'SRC'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SRC
          sed -i 's/^          //' /tmp/diag-apt/sources.d/ubuntu-official.sources
          ls -l /usr/share/keyrings/ubuntu-archive-keyring.gpg
          sudo apt-get update -o Dir::Etc::sourcelist=/dev/null -o Dir::Etc::sourceparts=/tmp/diag-apt/sources.d -o Dir::State::lists=/tmp/diag-apt/lists -o Acquire::Retries=0 -o Acquire::http::Timeout=15 2>&1 | tail -n 25
          echo "official-only apt-get update exit=${PIPESTATUS[0]}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Chromium OS dependency set Playwright 1.63.0 asks for, and what is already installed
        run: |
          set +e
          python -m pip install -q playwright==1.63.0
          echo '--- install-deps dry run'; python -m playwright install-deps --dry-run chromium 2>&1 | tail -n 12
          echo '--- missing among requested packages'
          python -m playwright install-deps --dry-run chromium 2>&1 | grep -o 'apt-get install.*' | tr ' ' '\n' | grep -vE '^(apt-get|install|-y|--no-install-recommends)$' | sort -u | while read p; do dpkg -s "$p" >/dev/null 2>&1 && echo "present  $p" || echo "MISSING  $p"; done
          echo '--- fonts on image'; fc-list | wc -l; fc-list : family | sort -u | head -n 20
      - name: Chromium download without OS packages, then real shared-library resolution
        run: |
          set +e
          python -m playwright install chromium 2>&1 | tail -n 6
          B=$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome 2>/dev/null | head -n 1); echo "chrome: $B"
          [ -n "$B" ] && ldd "$B" | grep -c 'not found' | sed 's/^/ldd not-found count: /'
          [ -n "$B" ] && ldd "$B" | grep 'not found'
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          try:
              with sync_playwright() as p:
                  b = p.chromium.launch(); pg = b.new_page(); pg.set_content("<p>x</p>"); print("chromium launch OK", b.version); b.close()
          except Exception as e:
              print("chromium launch FAILED:", str(e)[:300])
          PY
      - name: apt inside a Docker container (the native F01 image build path)
        run: |
          set +e
          timeout 300 docker run --rm ubuntu@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac bash -c 'apt-get update 2>&1 | tail -n 12; echo "docker apt-get update exit=$?"; apt-cache policy gcc-13 2>&1 | head -n 4'
