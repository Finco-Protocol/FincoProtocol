name: Model Runtime V4 Parity

on:
  pull_request:
    branches: [main]
    paths:
      - "financial_engine/**"
      - "tools/model_runtime_v4_parity.py"
      - ".github/workflows/model_runtime_v4_parity.yml"

permissions:
  contents: read

jobs:
  canonical-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: candidate

      - name: Checkout canonical base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: faf79e67c1e434b5c2a7d047f7106c7beb6a4623
          path: canonical

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: candidate/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r candidate/requirements.txt -c candidate/constraints.txt
          python -m pip check

      - name: Record canonical 25-scenario matrix
        run: |
          cp candidate/tools/model_runtime_v4_parity.py /tmp/model_runtime_v4_parity.py
          FINCO_RUNTIME_REPO_ROOT="$GITHUB_WORKSPACE/canonical"             python /tmp/model_runtime_v4_parity.py --record /tmp/v4_base.json

      - name: Compare candidate 25-scenario matrix
        run: |
          FINCO_RUNTIME_REPO_ROOT="$GITHUB_WORKSPACE/candidate"             python /tmp/model_runtime_v4_parity.py --compare /tmp/v4_base.json
