name: Model Q4 Finding-to-Scenario Focused Gate

on:
  pull_request:
    paths:
      - "app/v2/whatif.py"
      - "app/v2/whatif_router.py"
      - "app/v2/router.py"
      - "app/persistence/scenarios_repository.py"
      - "app/services/export_service.py"
      - "tests/test_model_q4_whatif.py"
      - "tests/test_model_q4_browser.py"
      - ".github/workflows/model_q4_gate.yml"

permissions:
  contents: read

jobs:
  q4-canonical-financial:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Run genuine Q4 scenarios and financial regressions
        run: |
          mkdir -p artifacts/q4
          python -m pytest -v tests/test_model_q4_whatif.py tests/test_model_insight_q3.py tests/test_model_insight_q3_scenario_identity.py tests/test_model_financing_f3_workspace.py tests/test_model_decision_workspace_v2.py --junitxml=artifacts/q4/focused.xml
          echo "PYTEST_MAIN_RETURNED rc=0"
          echo "PYTHON_PROCESS_EXITED child exit code 0"
      - name: Upload scoped test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-q4-focused
          path: artifacts/q4/
          if-no-files-found: error
