name: Dependency Security Audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          check-latest: false
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Attest exact tested head and tree
        run: python -m tools.ci_acceptance attest --expected '${{ github.event.pull_request.head.sha || github.sha }}' --output artifacts/source.json

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          python -m pip check

      - name: Capture resolved dependency set
        run: |
          mkdir -p artifacts
          python -m pip freeze > artifacts/resolved-requirements.txt

      - name: Install pinned pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit resolved dependencies
        run: |
          pip-audit \
            --requirement artifacts/resolved-requirements.txt \
            --no-deps \
            --strict \
            --progress-spinner off \
            --format json \
            --output artifacts/pip-audit.json

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-security-audit
          path: |
            artifacts/resolved-requirements.txt
            artifacts/pip-audit.json
            artifacts/source.json
          if-no-files-found: error
