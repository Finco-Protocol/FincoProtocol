name: Dependency Security Audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          python -m pip check

      - name: Capture resolved dependency set
        run: |
          mkdir -p artifacts
          python -m pip freeze > artifacts/resolved-requirements.txt

      - name: Install pinned pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit resolved dependencies
        run: |
          pip-audit \
            --requirement artifacts/resolved-requirements.txt \
            --no-deps \
            --strict \
            --progress-spinner off \
            --format json \
            --output artifacts/pip-audit.json

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-security-audit
          path: |
            artifacts/resolved-requirements.txt
            artifacts/pip-audit.json
          if-no-files-found: error
