name: Model Runtime V4 Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime-v4-probe:
    if: github.head_ref == 'perf/model-runtime-subsecond'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          python -m pip check

      - name: Compile profiling probe
        run: python -m compileall -q tools/profile_model_runtime_v4.py

      - name: Deep Solar profile and exact-input duplicate census
        env:
          FINCO_MODEL_WORKERS: "2"
        run: python tools/profile_model_runtime_v4.py --only solar --repeats 1

      - name: Deep Wind profile and exact-input duplicate census
        env:
          FINCO_MODEL_WORKERS: "2"
        run: python tools/profile_model_runtime_v4.py --only wind --repeats 1
