name: RWA Reflex Experimental

on:
  pull_request:
    paths:
      - "app/radar_rwa/reflex/**"
      - "tests/rwa_reflex_helpers.py"
      - "tests/test_rwa_reflex_*.py"
      - ".github/workflows/rwa_reflex_experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reflex-correction-a:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          python -m pip check

      - name: Compile Reflex namespace and tests
        run: python -m compileall -q app/radar_rwa/reflex tests/rwa_reflex_helpers.py tests/test_rwa_reflex_*.py

      - name: Git diff check
        run: git diff --check "origin/${GITHUB_BASE_REF}...HEAD"

      - name: Run Reflex Correction A acceptance
        run: pytest -q tests/test_rwa_reflex_*.py

      - name: Run B1 and B2 authority regressions
        run: >-
          pytest -q
          tests/test_radar_b1_authority.py
          tests/test_radar_b1_2_cross_chain_identity.py
          tests/test_radar_b1_3_intelligence.py
          tests/test_b2_1_verified_authority.py
          tests/test_b2_2_token_entitlement.py

      - name: Full Linux pytest
        run: pytest -q

      - name: Public repository safety scan
        run: python tools/public_safety_scan.py
