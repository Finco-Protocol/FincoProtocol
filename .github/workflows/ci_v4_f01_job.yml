# CI V4 reusable F01 financial acceptance (same steps and assertions as finval_f01_acceptance.yml; called by RISK and FULL).
name: CI V4 F01 Job
on:
  workflow_call:
    inputs:
      tested-sha:
        type: string
        required: true
      run-native:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  f01:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tested-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Attest exact tested source
        run: python -m tools.ci_acceptance attest --expected '${{ inputs.tested-sha }}' --output evidence/source.json
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install playwright==1.63.0
          python -m pip check
          playwright install chromium --with-deps
      - name: Four-vertical real browser rate round-trip and local acceptance
        env:
          FINVAL_BROWSER_EVIDENCE_DIR: evidence/browser
          FINVAL_EVIDENCE_DIR: evidence/financial
        run: |
          python -m pytest tests/finval_f01_browser_acceptance.py tests/test_finval_f01_complete.py tests/test_finval_f01_http_lifecycle.py tests/test_finval_f01_creation.py tests/test_finval_f01_hash_integrity.py tests/test_finval_f01_fixture_integrity.py tests/test_finval_rate_contract.py tests/test_finval_rate_run_acceptance.py tests/test_finval_f01_scope.py tests/test_finval_rate_successor.py -q -rs --junitxml=evidence/financial-browser.xml
      - name: Require all four browser cases and no skipped financial acceptance
        run: |
          python - <<'PYCODE'
          import xml.etree.ElementTree as E
          cases=list(E.parse('evidence/financial-browser.xml').getroot().iter('testcase'))
          assert cases and all(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in cases)
          assert len([c for c in cases if c.get('classname','').endswith('finval_f01_browser_acceptance')]) == 4
          PYCODE
      - name: Build unchanged approved native environment
        if: ${{ inputs.run-native }}
        run: docker build -f docs/ci_v3/phase4/runtime/Dockerfile -t finval-f01-native .
      - name: Twenty exact Python V10 V11 cases with edited rates
        if: ${{ inputs.run-native }}
        run: |
          mkdir -p evidence/native
          test "$(id -u)" -ne 0
          docker run --rm --network none --user "$(id -u):$(id -g)" --mount type=bind,src="$PWD",dst=/subject -w /subject -e PYTHONPYCACHEPREFIX=/tmp/f01-pycache -e FINVAL_EVIDENCE_DIR=/subject/evidence/native finval-f01-native python -m pytest tests/test_finval_f01_native_identity.py -q -rs --junitxml=evidence/native.xml
      - name: Require twenty native cases without skips
        if: ${{ inputs.run-native }}
        run: |
          python - <<'PYCODE'
          import xml.etree.ElementTree as E
          cases=list(E.parse('evidence/native.xml').getroot().iter('testcase'))
          assert len(cases)==20
          assert all(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in cases)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-v4-f01-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
