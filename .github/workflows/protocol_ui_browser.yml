name: Protocol UI Browser Acceptance

on:
  push:
    branches:
      - ui/protocol-unified-application-shell
      - "claude/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-ui-browser:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          python -m pip check

      - name: Install Playwright Python package
        run: pip install playwright

      - name: Install Playwright Chromium browser
        run: playwright install chromium --with-deps

      - name: Run Protocol UI browser acceptance suite
        run: pytest -v tests/test_ui_protocol_shell.py
        env:
          FINCO_VISUAL_CAPTURE: "1"
        # FINCO_TEST_CHROMIUM_PATH is intentionally unset here so Playwright
        # uses its own installed browser (playwright install chromium above).
        # The test fixture falls back to pw.chromium.launch() when the env var
        # is not set, which resolves the version installed in the previous step.

      - name: Upload SaaS visual acceptance captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saas-visual-acceptance
          path: artifacts/saas-visual/*.png
          if-no-files-found: warn
