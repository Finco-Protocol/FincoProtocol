name: Protocol UI Browser Acceptance

on:
  push:
    branches: [ui/protocol-unified-application-shell]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-suites:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        role: [protocol, import, grid, q4, outputs]
    uses: ./.github/workflows/ci_browser_job.yml
    with:
      role: ${{ matrix.role }}
      tested-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  merge-result-browser:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        role: [protocol, import, grid, q4, outputs]
    uses: ./.github/workflows/ci_browser_job.yml
    with:
      role: ${{ matrix.role }}
      tested-sha: ${{ github.sha }}
      artifact-prefix: merge-browser

  # Preserve optional F3 evidence as optional; never count absence as a pass.
  f3-evidence:
    uses: ./.github/workflows/ci_browser_job.yml
    with:
      role: f3
      tested-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  mandatory-browser-evidence:
    if: always()
    needs: [browser-suites, merge-result-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*browser*'
          path: evidence
      - name: Validate mandatory browser artifacts and normal exits
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
          RESULT: ${{ needs.browser-suites.result }}
          MERGE_SHA: ${{ github.sha }}
          MERGE_RESULT: ${{ needs.merge-result-browser.result }}
          EVENT: ${{ github.event_name }}
        run: |
          merge=()
          if [ "$EVENT" = pull_request ]; then merge=(--merge-sha "$MERGE_SHA" --merge-result "$MERGE_RESULT"); fi
          python -m tools.ci_browser_job aggregate --expected "$EXPECTED" --artifacts evidence --job-result "$RESULT" "${merge[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-mandatory-proof
          path: artifacts/browser-proof.json
          if-no-files-found: error
