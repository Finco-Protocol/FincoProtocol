name: Protocol UI Browser Acceptance

on:
  push:
    branches: [ui/protocol-unified-application-shell]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Preserve the existing mandatory-browser-evidence required context.
  # SIX unchanged browser roles, each in its own supervised process and isolated temp dir,
  # on ONE runner with ONE dependency + Chromium installation. No test selection is removed.
  mandatory-browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Exact-head source attestation
        run: python -m tools.ci_acceptance attest --expected '${{ github.event.pull_request.head.sha || github.sha }}' --output artifacts/source.json
      - name: Prove identical synthetic merge tree before browser setup
        run: |
          python -m tools.ci_merge_tree_guard \
            --expected '${{ github.event.pull_request.head.sha || github.sha }}' \
            --merge-sha '${{ github.event_name == 'pull_request' && github.sha || '' }}' \
            --pr-number '${{ github.event.pull_request.number || '' }}' \
            --output artifacts/merge-tree.json
      - name: Install and attest dependencies ONCE
        run: |
          python -m tools.ci_acceptance run --expected '${{ github.event.pull_request.head.sha || github.sha }}' --label install --output artifacts/install.json -- \
            bash -e -c 'python -m pip install --upgrade pip; pip install -r requirements.txt -c constraints.txt; python -m pip check; pip install playwright==1.63.0; python -m pip check'
      - name: Cache version-bound Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-ubuntu24-py312-pw1.63.0
      - name: Install Chromium and OS dependencies ONCE
        run: python -m tools.ci_acceptance run --expected '${{ github.event.pull_request.head.sha || github.sha }}' --label chromium --output artifacts/chromium.json -- playwright install chromium --with-deps
      - name: All SIX mandatory browser roles (isolated supervised pytest processes)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FINCO_CI_PYTEST_BUDGET_S: '1200'
          FINCO_CI_EXIT_GRACE_S: '180'
          FINCO_CI_DIAG_PATH: artifacts/ci-hang-diagnostics.txt
        run: |
          set -euo pipefail
          mkdir -p evidence
          for role in protocol import grid q4 outputs consolidation; do
            # Prevent cross-role temp-file reuse; each helper starts a NEW Python/pytest process.
            mkdir -p "$RUNNER_TEMP/finco-browser-$role"
            export TMPDIR="$RUNNER_TEMP/finco-browser-$role"
            echo "CI_BROWSER_ROLE_START=$role HEAD=$HEAD_SHA"
            python -m tools.ci_browser_job "$role" --expected "$HEAD_SHA"
            mv artifacts "evidence/browser-$role"
            echo "CI_BROWSER_ROLE_DONE=$role"
          done
          # Exact roles, full selected tests, normal exits, checksum/JUnit and screenshots
          # are checked by the existing fail-closed browser evidence verifier.
          python -m tools.ci_browser_job aggregate --expected "$HEAD_SHA" \
            --artifacts evidence --job-result success
      - name: Upload role evidence, manifests and original process provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-mandatory-suite-evidence
          path: |
            evidence/
            artifacts/
          if-no-files-found: error
      - name: Preserve consolidation screenshot artifact alias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-workspace-consolidation-browser
          path: evidence/browser-consolidation/workspace-consolidation/
          if-no-files-found: warn
      - name: Preserve mandatory browser proof artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-mandatory-proof
          path: artifacts/browser-proof.json
          if-no-files-found: warn
