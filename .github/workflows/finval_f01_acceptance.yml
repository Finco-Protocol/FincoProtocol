name: FIN-VAL F01 Financial Acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rate-contract-native-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Attest exact review head and merge tree
        run: |
          python -m tools.ci_acceptance attest --expected '${{ github.event.pull_request.head.sha || github.sha }}' --output evidence/source.json
          python -m tools.ci_merge_tree_guard --expected '${{ github.event.pull_request.head.sha || github.sha }}' --merge-sha '${{ github.event_name == 'pull_request' && github.sha || '' }}' --pr-number '${{ github.event.pull_request.number || '' }}' --output evidence/merge-tree.json
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install playwright==1.63.0
          python -m pip check
          playwright install chromium --with-deps
      - name: Four-vertical real browser rate round-trip and local acceptance
        env:
          FINVAL_BROWSER_EVIDENCE_DIR: evidence/browser
          FINVAL_EVIDENCE_DIR: evidence/financial
        run: |
          python -m pytest tests/finval_f01_browser_acceptance.py tests/test_finval_f01_complete.py tests/test_finval_f01_http_lifecycle.py tests/test_finval_f01_creation.py tests/test_finval_rate_contract.py tests/test_finval_rate_run_acceptance.py tests/test_finval_f01_scope.py tests/test_finval_rate_successor.py -q -rs --junitxml=evidence/financial-browser.xml
      - name: Build unchanged approved native environment
        run: docker build -f docs/ci_v3/phase4/runtime/Dockerfile -t finval-f01-native .
      - name: Twenty exact Python V10 V11 cases with edited rates
        run: |
          mkdir -p evidence/native
          chmod -R a+rwX evidence
          docker run --rm --network none --mount type=bind,src="$PWD",dst=/subject -w /subject -e PYTHONPYCACHEPREFIX=/tmp/f01-pycache -e FINVAL_EVIDENCE_DIR=/subject/evidence/native finval-f01-native python -m pytest tests/test_finval_f01_native_identity.py -q -rs --junitxml=evidence/native.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: finval-f01-exact-head
          path: evidence/
          if-no-files-found: error
