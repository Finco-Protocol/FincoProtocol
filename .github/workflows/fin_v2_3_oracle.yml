name: FIN-V2-3 Independent Oracle Artifact
on:
  pull_request:
    paths:
      - 'app/**'
      - 'financial_engine/**'
      - 'finco_core/**'
      - 'tests/fin_v2_3*'
      - 'tests/test_fin_v2_3*'
      - 'docs/financial_validation/fin_v2_3/**'
      - 'tools/fin_v2_3_oracle_workbook.py'
      - '.github/workflows/fin_v2_3_oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fin-v2-3-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  independent-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Attest exact source head
        run: python -m tools.ci_acceptance attest --expected '${{ github.event.pull_request.head.sha || github.sha }}' --output evidence/fin-v2-3-oracle/source.json
      - name: Install pinned spreadsheet writer
        run: python -m pip install XlsxWriter==3.2.9
      - name: Rebuild independent workbook from frozen synthetic inputs
        run: python tools/fin_v2_3_oracle_workbook.py --inputs docs/financial_validation/fin_v2_3/ORACLE_COMMITTED_INPUTS.json.gz --output-dir evidence/fin-v2-3-oracle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fin-v2-3-oracle-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/fin-v2-3-oracle/
          if-no-files-found: error
