name: Production ASGI Boot Smoke

on:
  push:
    branches:
      - fix/opus-h6-production-asgi-service
  pull_request:

permissions:
  contents: read

jobs:
  production-boot-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FINCO_SECRET_KEY: ci_h6_non_placeholder_secret_key_0123456789abcdef0123456789abcdef
      FINCO_ADMIN_USER: ci-admin
      FINCO_ADMIN_PASSWORD: ci-h6-password
      FINCO_COOKIE_SECURE: "false"
      FINCO_DB_PATH: /tmp/finco-h6.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install repository dependencies plus reproduction-only Gunicorn
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          # H-6 pre-fix reproduction only: the service declares Gunicorn but the
          # repository does not. Install it here so this step reaches the ASGI/WSGI
          # mismatch instead of stopping at "command not found".
          pip install gunicorn
          python -m pip check

      - name: Reproduce current production service command
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/finco-h6-gunicorn.log
          gunicorn main_web:app \
            --workers 1 \
            --bind 127.0.0.1:8765 \
            --timeout 30 \
            --access-logfile - \
            --error-logfile - \
            --capture-output >"$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; cat "$LOG" || true' EXIT

          for _ in $(seq 1 20); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "production process exited before health request" >&2
              exit 1
            fi
            STATUS=$(curl -sS -o /tmp/finco-h6-health-body -w '%{http_code}' http://127.0.0.1:8765/public-health || true)
            if [[ "$STATUS" != "000" ]]; then
              echo "public-health status=$STATUS"
              test "$STATUS" = "200"
              kill -0 "$PID"
              exit 0
            fi
            sleep 1
          done

          echo "bounded startup period expired without a response" >&2
          exit 1
