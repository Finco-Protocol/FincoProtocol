name: Production ASGI Boot Smoke

on:
  push:
    branches: [main]
    paths:
      - "deploy/systemd/finco-web.service"
      - "deploy/scripts/run_web.sh"
      - "deploy/scripts/restore.sh"
      - "deploy/scripts/start_prod.sh"
      - "deploy/env.example"
      - "deploy/staging.env.example"
      - "requirements.txt"
      - "constraints.txt"
      - ".github/workflows/production_boot_smoke.yml"
  pull_request:
    paths:
      - "deploy/systemd/finco-web.service"
      - "deploy/scripts/run_web.sh"
      - "deploy/scripts/restore.sh"
      - "deploy/scripts/start_prod.sh"
      - "deploy/env.example"
      - "deploy/staging.env.example"
      - "requirements.txt"
      - "constraints.txt"
      - ".github/workflows/production_boot_smoke.yml"

permissions:
  contents: read

jobs:
  production-boot-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Synthetic CI-only values. No deployment secrets are used by this workflow.
      FINCO_SECRET_KEY: ci_h6_non_placeholder_secret_key_0123456789abcdef0123456789abcdef
      FINCO_ADMIN_USER: ci-admin
      FINCO_ADMIN_PASSWORD: ci-h6-fixture-9c4e7a1b2d0f
      FINCO_APP_MODE: pilot
      FINCO_COOKIE_SECURE: "true"
      FINCO_DB_PATH: /tmp/finco-h6.db
      FINCO_WEB_HOST: 127.0.0.1
      FINCO_WEB_PORT: "8765"
      FINCO_WEB_WORKERS: "1"
      FINCO_WEB_GRACEFUL_SHUTDOWN_SECONDS: "15"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Build clean production-equivalent virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -c constraints.txt
          .venv/bin/python -m pip check
          .venv/bin/python -c 'import uvicorn; print("uvicorn", uvicorn.__version__)'

      - name: Validate production command wiring
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/scripts/run_web.sh
          bash -n deploy/scripts/start_prod.sh
          bash -n deploy/scripts/restore.sh
          bash -n deploy/scripts/healthcheck.sh
          grep -Fq 'ExecStart=/bin/bash /opt/finco_protocol/deploy/scripts/run_web.sh' deploy/systemd/finco-web.service
          if grep -R --line-number -E 'gunicorn[[:space:]]+main_web:app' deploy/systemd deploy/scripts; then
            echo "ERROR: stale broken Gunicorn/FastAPI production invocation remains" >&2
            exit 1
          fi

      - name: Mandatory configuration fails closed without leaking values
        shell: bash
        run: |
          set -euo pipefail
          set +e
          env -u FINCO_SECRET_KEY -u FINCO_ADMIN_USER -u FINCO_ADMIN_PASSWORD \
            /bin/bash deploy/scripts/run_web.sh >/tmp/finco-h6-missing.stdout 2>/tmp/finco-h6-missing.stderr
          RC=$?
          set -e
          test "$RC" -eq 78
          grep -Fq 'FINCO_SECRET_KEY' /tmp/finco-h6-missing.stderr
          if grep -Fq "$FINCO_SECRET_KEY" /tmp/finco-h6-missing.stderr; then
            echo "ERROR: configuration value leaked to stderr" >&2
            exit 1
          fi

      - name: Secure mode is mandatory (P0-C)
        shell: bash
        run: |
          set -euo pipefail
          for BAD in "" development internal; do
            set +e
            FINCO_APP_MODE="$BAD" /bin/bash deploy/scripts/run_web.sh >/tmp/finco-p0c-mode.out 2>/tmp/finco-p0c-mode.err
            RC=$?
            set -e
            test "$RC" -eq 78
            if grep -Fq "$FINCO_SECRET_KEY" /tmp/finco-p0c-mode.err; then
              echo "ERROR: configuration value leaked to stderr" >&2
              exit 1
            fi
          done
          set +e
          FINCO_ADMIN_PASSWORD='FINCO Model2026!' /bin/bash deploy/scripts/run_web.sh >/tmp/finco-p0c-admin.out 2>/tmp/finco-p0c-admin.err
          RC=$?
          set -e
          test "$RC" -eq 78
          if grep -Fq 'FINCO Model2026' /tmp/finco-p0c-admin.err; then
            echo "ERROR: default credential echoed to stderr" >&2
            exit 1
          fi

      - name: Start declared production command and require live HTTP 200
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/finco-h6-uvicorn.log
          BODY=/tmp/finco-h6-health-body

          /bin/bash deploy/scripts/run_web.sh >"$LOG" 2>&1 &
          PID=$!

          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          STATUS=000
          for _ in $(seq 1 30); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "ERROR: production process exited during startup" >&2
              cat "$LOG" >&2 || true
              exit 1
            fi
            STATUS=$(curl --max-time 1 -sS -o "$BODY" -w '%{http_code}' http://127.0.0.1:8765/public-health || true)
            if [[ "$STATUS" == "200" ]]; then
              break
            fi
            if [[ "$STATUS" != "000" ]]; then
              echo "ERROR: /public-health returned HTTP $STATUS" >&2
              cat "$BODY" >&2 || true
              cat "$LOG" >&2 || true
              exit 1
            fi
            sleep 1
          done

          test "$STATUS" = "200"
          grep -Fq '"status":"ok"' "$BODY"
          kill -0 "$PID"
          sleep 1
          kill -0 "$PID"
          echo "PRODUCTION_BOOT_HEALTH_HTTP_200=PASS"
          echo "PRODUCTION_PROCESS_ALIVE_AFTER_HEALTH=PASS"

          kill "$PID"
          for _ in $(seq 1 40); do
            if ! kill -0 "$PID" 2>/dev/null; then
              wait "$PID" 2>/dev/null || true
              trap - EXIT
              echo "PRODUCTION_PROCESS_CLEAN_TERMINATION=PASS"
              exit 0
            fi
            sleep 0.25
          done

          echo "ERROR: production process did not terminate after SIGTERM" >&2
          kill -9 "$PID" 2>/dev/null || true
          exit 1
