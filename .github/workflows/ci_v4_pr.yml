# CI V4 required PR acceptance: FAST always, RISK when the TRUSTED base policy maps a change to a critical surface (fail closed).
# Required status check name (stable): "CI V4 PR / CI V4 gate". A non-selected test is reported NOT SELECTED, never PASS.
name: CI V4 PR
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-v4-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      matrix: ${{ steps.plan.outputs.matrix }}
      needs_browser: ${{ steps.plan.outputs.needs_browser }}
      needs_native: ${{ steps.plan.outputs.needs_native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Attest exact head and identical synthetic merge tree (one central pass)
        working-directory: subject
        run: |
          python -m tools.ci_acceptance attest --expected '${{ github.event.pull_request.head.sha }}' --output ../evidence/source.json
          python -m tools.ci_merge_tree_guard --expected '${{ github.event.pull_request.head.sha }}' --merge-sha '${{ github.sha }}' --pr-number '${{ github.event.pull_request.number }}' --output ../evidence/merge-tree.json
      - name: Select with the TRUSTED base policy; refuse a self-weakening head policy
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -f trusted/tools/ci_v4_select.py ] && [ -f trusted/docs/ci_v4/ci-v4-policy.json ]; then
            SEL=trusted; echo "selector: trusted base"
          else
            SEL=subject; echo "selector: BOOTSTRAP (base has no CI V4); tier forced to risk"; FORCE="--tier risk"
          fi
          HP=""; [ -f subject/docs/ci_v4/ci-v4-policy.json ] && HP="--head-policy $PWD/subject/docs/ci_v4/ci-v4-policy.json"
          (cd "$SEL" && python -m tools.ci_v4_select --policy docs/ci_v4/ci-v4-policy.json $HP --repo ../subject --base "$BASE_SHA" --head "$HEAD_SHA" ${FORCE:-} --output ../evidence/ci-v4-plan.json)
          python - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open('evidence/ci-v4-plan.json'))
          print('tier=' + p['tier'])
          print('matrix=' + json.dumps({'index': list(range(len(p['schedule']['shards'])))}))
          print('needs_browser=' + str(p['needs_browser']).lower())
          print('needs_native=' + str(p['needs_native_docker']).lower())
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-v4-plan
          path: evidence/
          if-no-files-found: error
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci-tests.txt
            constraints.txt
      - name: Compile, public safety (secret) scan, dependency consistency
        run: |
          python -m compileall -q .
          python tools/public_safety_scan.py
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip check
      - name: React typecheck, build and served bundle identity
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          cp dist/finco-react.js dist/finco-react.css ../static/react/
          git diff --exit-code -- ../static/react
  shards:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: shard-${{ matrix.index }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci-tests.txt
            constraints.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-v4-plan
          path: ${{ runner.temp }}/ci-v4/plan
      # Same runtime as the CI V3 workers (no Playwright/Chromium): browser modules skip exactly as in V3 and are listed SKIPPED (not PASS).
      # Browser acceptance stays in the F01 job and the mandatory browser roles. Several browser modules that V3 never executes are stale
      # (e.g. mutation posts without CSRF -> 403); enabling Chromium here is a separate, owner-approved follow-up (docs/ci_v4/FINAL_REPORT_HR.md).
      - name: Install
        run: |
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-ci-tests.txt -c constraints.txt
      # Plan and output live OUTSIDE the checkout: an untracked directory in the tested tree would (correctly) make the exact-source cohorts fail.
      - name: Run the planned shard (selected modules only)
        run: python -m tools.ci_v4_shard --plan "$RUNNER_TEMP/ci-v4/plan/ci-v4-plan.json" --index ${{ matrix.index }} --output "$RUNNER_TEMP/ci-v4/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-v4-shard-${{ matrix.index }}
          path: ${{ runner.temp }}/ci-v4/out/
          if-no-files-found: error
  f01:
    needs: plan
    if: ${{ needs.plan.outputs.needs_browser == 'true' || needs.plan.outputs.needs_native == 'true' }}
    uses: ./.github/workflows/ci_v4_f01_job.yml
    with:
      tested-sha: ${{ github.event.pull_request.head.sha }}
      run-native: ${{ needs.plan.outputs.needs_native == 'true' }}
  gate:
    name: CI V4 gate
    if: always()
    needs: [plan, static, shards, f01]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Every selected job concluded success; a job may be skipped only when the plan did not select it
        env:
          PLAN: ${{ needs.plan.result }}
          STATIC: ${{ needs.static.result }}
          SHARDS: ${{ needs.shards.result }}
          F01: ${{ needs.f01.result }}
          NB: ${{ needs.plan.outputs.needs_browser }}
          NN: ${{ needs.plan.outputs.needs_native }}
        run: |
          test "$PLAN" = success && test "$STATIC" = success && test "$SHARDS" = success
          if [ "$NB" = true ] || [ "$NN" = true ]; then test "$F01" = success; else test "$F01" = skipped; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-v4-plan
          path: ev/ci-v4-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ci-v4-shard-*
          path: ev/shards
      - name: Aggregate (trusted base aggregator when present) - executed == selected, no foreign/duplicate node, skips listed (never PASS)
        run: |
          AGG=subject; [ -f trusted/tools/ci_v4_aggregate.py ] && AGG=trusted
          (cd "$AGG" && python -m tools.ci_v4_aggregate --plan ../ev/ci-v4-plan/ci-v4-plan.json --shards ../ev/shards --junit ../ev/shards --output ../result)
      - name: Manifest summary
        if: always()
        run: |
          python - <<'PYCODE' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          try:
              p = json.load(open('ev/ci-v4-plan/ci-v4-plan.json')); r = json.load(open('result/ci-v4-result.json'))
          except OSError as e:
              print('CI V4: no result (%s)' % e); raise SystemExit
          print('## CI V4 %s - %s' % (p['tier'].upper(), r['verdict']))
          print('tested sha %s tree %s; rules %s' % (p['tested_sha'], p['tested_tree'], ', '.join(p['rule_ids'])))
          print('selected modules %d, executed nodes %d, %s: %d' % (r['selected_modules'], r['executed_nodes'], p['not_selected']['label'], p['not_selected']['count']))
          print('workers %d, predicted critical path %ss, actual slowest shard %ss, shard runner-minutes %s' % (r['workers'], p['schedule']['predicted_critical_path_s'], r['actual_critical_path_s'], r['actual_runner_minutes']))
          for x in r['problems']: print('- PROBLEM: ' + x)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-v4-pr-manifest
          path: result/
          if-no-files-found: warn
