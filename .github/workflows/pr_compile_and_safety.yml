name: PR Compile and Safety Gate

# Fast gate that runs on EVERY pull request regardless of which files changed.
# Other workflows are path-filtered; this ensures a minimum check always runs.
# Target runtime: ~2 minutes.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: compile-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile-and-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-ci-tests.txt
            constraints.txt

      - name: Attest exact tested head and tree
        run: python -m tools.ci_acceptance attest --expected '${{ github.event.pull_request.head.sha || github.sha }}' --output artifacts/source.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-ci-tests.txt -c constraints.txt
          python -m pip check

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Public repository safety scan
        run: python tools/public_safety_scan.py

      # Focused self-tests inside the already-required fast gate; no additional runner/job.
      - name: CI V2 architecture and evidence contracts (when present)
        run: |
          if [ -f tests/test_ci_optimization_v2.py ]; then
            python -m pytest -q tests/test_ci_optimization_v2.py --junitxml=artifacts/ci-v2-contract-results.xml
          fi

      # UX-01/UX-01B Correction A (additive, same already-required fast gate):
      # prove the checked-in React source typechecks, builds, and that the
      # served static/react bundle corresponds EXACTLY to that source, then run
      # the React contract/harvest guard tests.  Chromium acceptance stays in
      # the existing browser role (tools/ci_browser_job.py "grid" selection).
      - name: React PoC build, bundle identity and contract guards (when present)
        run: |
          if [ -f package.json ]; then
            node --version
            npm ci --ignore-scripts --no-audit --no-fund
            npm run typecheck
            npm run build
            cp dist/finco-react.js dist/finco-react.css ../static/react/
            git diff --exit-code -- ../static/react
          fi
        working-directory: frontend

      - name: React PoC contract and harvest guard tests (when present)
        run: |
          if [ -f frontend/package.json ]; then
            files=""
            [ -f tests/test_model_react_poc_v1.py ] && files="$files tests/test_model_react_poc_v1.py"
            [ -f tests/test_model_react_source_harvest_v1.py ] && files="$files tests/test_model_react_source_harvest_v1.py"
            if [ -n "$files" ]; then
              python -m pytest -q $files --junitxml=artifacts/react-poc-contract-results.xml
            fi
          fi

      - name: Upload exact-head provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compile-source-provenance
          path: |
            artifacts/source.json
            artifacts/ci-v2-contract-results.xml
          if-no-files-found: error

      - name: Upload React PoC contract evidence (when present)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: react-poc-contract-provenance
          path: artifacts/react-poc-contract-results.xml
          if-no-files-found: ignore
