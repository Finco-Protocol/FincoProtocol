name: PR Compile and Safety Gate

# Fast gate that runs on EVERY pull request regardless of which files changed.
# Other workflows are path-filtered; this ensures a minimum check always runs.
# Target runtime: ~2 minutes.

on:
  pull_request:

permissions:
  contents: read

jobs:
  compile-and-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          python -m pip check

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Public repository safety scan
        run: python tools/public_safety_scan.py
