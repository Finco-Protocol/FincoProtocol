name: PR Compile and Safety Gate

# Fast gate that runs on EVERY pull request regardless of which files changed.
# Other workflows are path-filtered; this ensures a minimum check always runs.
# Target runtime: ~2 minutes.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: compile-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile-and-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Attest exact tested head and tree
        run: python -m tools.ci_acceptance attest --expected '${{ github.event.pull_request.head.sha || github.sha }}' --output artifacts/source.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          python -m pip check

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Public repository safety scan
        run: python tools/public_safety_scan.py

      - name: Upload exact-head provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compile-source-provenance
          path: artifacts/source.json
          if-no-files-found: error
