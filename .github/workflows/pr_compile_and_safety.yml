name: PR Compile and Safety Gate

# Fast gate that runs on EVERY pull request regardless of which files changed.
# Other workflows are path-filtered; this ensures a minimum check always runs.
# Target runtime: ~2 minutes.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: compile-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile-and-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-ci-tests.txt
            constraints.txt

      - name: Attest exact tested head and tree
        run: python -m tools.ci_acceptance attest --expected '${{ github.event.pull_request.head.sha || github.sha }}' --output artifacts/source.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-ci-tests.txt -c constraints.txt
          python -m pip check

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Public repository safety scan
        run: python tools/public_safety_scan.py

      # Focused self-tests inside the already-required fast gate; no additional runner/job.
      - name: CI V2 architecture and evidence contracts (when present)
        run: |
          if [ -f tests/test_ci_optimization_v2.py ]; then
            python -m pytest -q tests/test_ci_optimization_v2.py --junitxml=artifacts/ci-v2-contract-results.xml
          fi

      - name: Upload exact-head provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compile-source-provenance
          path: |
            artifacts/source.json
            artifacts/ci-v2-contract-results.xml
          if-no-files-found: error
