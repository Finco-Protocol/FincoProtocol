# Known baseline defects (tests/known_defects.txt): runs ONLY those tests, on real Chromium. Advisory, NOT a required
# check, never runs on pull requests (nightly + manual only), and expected to stay red until each defect is fixed (then its line is removed in the fixing PR and the test
# returns to the required Model CI groups). Never counts as a pass of anything.
name: Model known defects
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  PIP_DEFAULT_TIMEOUT: '60'
  PIP_RETRIES: '10'
  PLAYWRIGHT_VERSION: '1.63.0'
jobs:
  known-defects:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci-tests.txt
            constraints.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install
        run: |
          python -m pip install -r requirements.txt -r requirements-ci-tests.txt -c constraints.txt
          (cd frontend && npm ci --ignore-scripts --no-audit --no-fund)
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            playwright install-deps chromium
          else
            playwright install chromium --with-deps
          fi
      - name: Run the known defects (expected RED until fixed)
        env:
          FINCO_CI_STRICT_SKIPS: '1'
        run: |
          mapfile -t NODES < <(python scripts/ci/known_defects.py)
          if [ "${#NODES[@]}" -eq 0 ]; then
            echo "No active known defects in tests/known_defects.txt; skipping pytest."
            exit 0
          fi
          python -m pytest -q -rfEs -p no:cacheprovider "${NODES[@]}"
