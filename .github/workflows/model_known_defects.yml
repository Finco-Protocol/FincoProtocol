# Known baseline defects (tests/known_defects.txt): runs ONLY those tests, on real Chromium. Advisory, NOT a required
# check, and expected to stay red until each defect is fixed (then its line is removed in the fixing PR and the test
# returns to the required Model CI groups). Never counts as a pass of anything.
name: Model known defects
on:
  pull_request:
    paths: ['tests/known_defects.txt']
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  known-defects:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci-tests.txt
            constraints.txt
      - name: Install
        run: |
          python -m pip install -r requirements.txt -r requirements-ci-tests.txt -c constraints.txt
          (cd frontend && npm ci --ignore-scripts --no-audit --no-fund)
          playwright install chromium --with-deps
      - name: Run the known defects (expected RED until fixed)
        env:
          FINCO_CI_STRICT_SKIPS: '1'
        run: |
          NODES=$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' tests/known_defects.txt | awk '{print $1}')
          python -m pytest -q -rfEs -p no:cacheprovider $NODES
