# CI V4 FULL regression: the unchanged CI V3 full regression (>21k nodes, all history/exactness checks) + F01 with native identity.
# Nightly, on demand, and the mandatory input of the release gate (ci_v4_release_gate.yml) for the identical sha.
name: CI V4 FULL
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-v4-full-${{ github.sha }}
  cancel-in-progress: false
jobs:
  v3-regression:
    uses: ./.github/workflows/ci_v3_required_job.yml
    with:
      mode: control
      tested-sha: ${{ github.sha }}
      source-base: ${{ github.sha }}
      merge-sha: ''
      pr-number: ''
    permissions:
      contents: read
      actions: read
  f01:
    uses: ./.github/workflows/ci_v4_f01_job.yml
    with:
      tested-sha: ${{ github.sha }}
      run-native: true
  record:
    if: always()
    needs: [v3-regression, f01]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: public-*
          path: evidence
      - name: Bind FULL result to this exact sha/tree (fails closed)
        run: |
          python -m tools.ci_v4_full_record --sha '${{ github.sha }}' --evidence evidence --output record \
            --result 'v3=${{ needs.v3-regression.result }}' --result 'f01=${{ needs.f01.result }}' \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-v4-full-record
          path: record/
          if-no-files-found: error
