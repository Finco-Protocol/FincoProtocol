# CI V4 FULL regression (P2): EVERY collected pytest node of this exact sha, in disjoint authenticated shards (tools/ci_full_parallel.py), + F01
# (4-vertical browser + 20 native cases). Nightly, on demand, and the mandatory input of the release gate (ci_v4_release_gate.yml) for the identical sha.
# Nothing is selected or skipped to fit a time budget: plan = ONE exact collection; record = executed == collected (disjoint union), every skip in the
# reviewed baseline, every artifact of this attempt re-downloaded through the API and matched to GitHub's digest. The record is a claim: the release
# gate and the V5 gate re-verify the GitHub run (repository, this workflow path, schedule/workflow_dispatch, branch main, exact sha, conclusion).
name: CI V4 FULL
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-v4-full-${{ github.sha }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      workers: ${{ steps.plan.outputs.workers }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci-tests.txt
            constraints.txt
      - name: Install (same runtime as every shard)
        run: |
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-ci-tests.txt -c constraints.txt
          python -m pip install playwright==1.63.0
          export PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          python -m playwright install chromium --with-deps
          python -m pip check
      # Plan and outputs live OUTSIDE the checkout: an untracked path in the tested tree would (correctly) fail the exact-source cohorts.
      - name: One exact collection of the whole suite; sealed adaptive plan (union == inventory, disjoint)
        id: plan
        run: |
          python -m tools.ci_full_parallel plan --expected '${{ github.sha }}' --output "$RUNNER_TEMP/full/plan" --workdir "$RUNNER_TEMP/full/work" \
            --weights docs/ci_v4/module_weights.json --weights docs/ci_v4/node_weights.json --weights docs/ci_v4/performance_baseline.json \
            --weights docs/ci_v4/p2_full/full_node_weights.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-full-plan-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full/plan/
          if-no-files-found: error
  recollect:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci-tests.txt
            constraints.txt
      - name: Install
        run: |
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-ci-tests.txt -c constraints.txt
          python -m pip install playwright==1.63.0
          export PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          python -m playwright install chromium --with-deps
          python -m pip check
      - name: Independent re-collection in a separate job (compared to the plan by the record)
        run: python -m tools.ci_full_parallel recollect --expected '${{ github.sha }}' --output "$RUNNER_TEMP/full/recollect" --workdir "$RUNNER_TEMP/full/work"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-full-recollect-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full/recollect/
          if-no-files-found: error
  shards:
    needs: plan
    runs-on: ubuntu-24.04
    # hard ceiling only: each shard's pytest is also killed by its sealed per-shard limit (exit 124, recorded, never a pass)
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: shard-${{ matrix.index }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci-tests.txt
            constraints.txt
      # Match both collection jobs so browser nodes participate in the sealed FULL
      # inventory. The separate F01 acceptance job is still mandatory.
      - name: Install (Python deps, Chromium and frontend node_modules)
        run: |
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-ci-tests.txt -c constraints.txt
          python -m pip install playwright==1.63.0
          export PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          python -m playwright install chromium --with-deps
          python -m pip check
          (cd frontend && npm ci --ignore-scripts --no-audit --no-fund)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-full-plan-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full/plan
      - name: Run exactly the sealed assignment (every assigned module's collection must equal the planned inventory first)
        env:
          FINCO_VISUAL_CAPTURE: '1'
          FINCO_VISUAL_CAPTURE_DIR: ${{ runner.temp }}/full/out/visual-capture
        run: python -m tools.ci_full_parallel shard --plan "$RUNNER_TEMP/full/plan/plan.json" --index ${{ matrix.index }} --output "$RUNNER_TEMP/full/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-full-shard-${{ matrix.index }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full/out/
          if-no-files-found: error
  f01:
    uses: ./.github/workflows/ci_v4_f01_job.yml
    with:
      tested-sha: ${{ github.sha }}
      run-native: true
  record:
    if: always()
    needs: [plan, recollect, shards, f01]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Authenticated strict FULL record bound to this exact sha/tree/run/attempt (fails closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m tools.ci_full_parallel record --expected '${{ github.sha }}' --workers '${{ needs.plan.outputs.workers || 0 }}' \
            --output "$RUNNER_TEMP/full/record" --result 'plan=${{ needs.plan.result }}' --result 'recollect=${{ needs.recollect.result }}' \
            --result 'shards=${{ needs.shards.result }}' --result 'f01=${{ needs.f01.result }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-v4-full-record
          path: ${{ runner.temp }}/full/record/
          if-no-files-found: error
