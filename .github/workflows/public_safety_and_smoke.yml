name: Public Safety and Model Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  safety-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Public repository safety scan
        run: python tools/public_safety_scan.py
      - name: Compile
        run: python -m compileall -q .
      - name: Synthetic reference smoke tests
        run: pytest -q
