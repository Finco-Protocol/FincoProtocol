name: Public Safety and Model Smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  safety-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Public repository safety scan
        run: python tools/public_safety_scan.py
      - name: Compile
        run: python -m compileall -q .
      - name: Synthetic reference and regression tests
        run: |
          mkdir -p artifacts
          pytest -q --junitxml=artifacts/public-test-results.xml
      - name: Upload public verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-verification-results
          path: artifacts/public-test-results.xml
          if-no-files-found: error
