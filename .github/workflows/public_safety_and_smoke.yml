name: Public Safety and Model Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  safety-and-smoke:
    uses: ./.github/workflows/ci_public_job.yml
    with:
      mode: control
      tested-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  # Keep synthetic-merge full coverage separate from exact feature-head proof.
  # Neither unsharded control is replaced by the candidate shards.
  merge-result-integration:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ci_public_job.yml
    with:
      mode: integration
      tested-sha: ${{ github.sha }}

  shadow-shards:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    uses: ./.github/workflows/ci_public_job.yml
    with:
      mode: shard-${{ matrix.shard }}
      tested-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  mandatory-evidence:
    if: always()
    needs: [safety-and-smoke, merge-result-integration, shadow-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require complete control and integration outcomes
        env:
          CONTROL: ${{ needs.safety-and-smoke.result }}
          INTEGRATION: ${{ needs.merge-result-integration.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$CONTROL" = success
          if [ "$EVENT" = pull_request ]; then test "$INTEGRATION" = success; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: public-*
          path: evidence
      - name: Prove exact-head shadow equivalence
        if: github.event_name != 'push'
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
          CONTROL: ${{ needs.safety-and-smoke.result }}
          SHARDS: ${{ needs.shadow-shards.result }}
        run: |
          python -m tools.ci_acceptance compare --expected "$EXPECTED" \
            --artifacts evidence --output artifacts/shadow-equivalence.json \
            --control-result "$CONTROL" --shard-result "$SHARDS"
      - name: Attest main control provenance
        if: github.event_name == 'push'
        run: python -m tools.ci_acceptance attest --expected '${{ github.sha }}' --output artifacts/main-attestation.json
      - name: Upload mandatory aggregate proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-shadow-proof
          path: artifacts/
          if-no-files-found: error
