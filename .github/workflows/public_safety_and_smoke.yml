name: Public Safety and Model Smoke

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "app/**"
      - "domain/**"
      - "finco_app/**"
      - "financial_engine/**"
      - "finco_core/**"
      - "finco_protocol/**"
      - "finco_radar/**"
      - "utils/**"
      - "tests/**"
      - "tools/**"
      - "main_api.py"
      - "main_web.py"
      - "pytest.ini"
      - "requirements.txt"
      - "constraints.txt"
      - "setup.py"
      - "setup.cfg"
      - "pyproject.toml"
      - ".github/workflows/public_safety_and_smoke.yml"

permissions:
  contents: read

jobs:
  safety-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Correction J: merge-base-aware frozen-diff governance requires
          # repository ancestry; the shallow default cannot resolve
          # merge-base(origin/main, HEAD) and fails the guards closed.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Public repository safety scan
        run: python tools/public_safety_scan.py
      - name: Compile
        run: python -m compileall -q .
      - name: Synthetic reference and regression tests
        # Full suite, supervised from OUTSIDE the pytest process.  A normal run takes
        # ~21 min; if pytest (or interpreter shutdown after it) exceeds the budget the
        # supervisor records the process tree and every Python thread stack, terminates
        # the group and FAILS the step (exit 124).  A timeout is never reported as success.
        timeout-minutes: 75
        env:
          FINCO_CI_PYTEST_BUDGET_S: "2700"
          FINCO_CI_EXIT_GRACE_S: "180"
          FINCO_CI_DIAG_PATH: artifacts/ci-hang-diagnostics.txt
        run: |
          mkdir -p artifacts
          python tools/ci_pytest_runner.py -q --junitxml=artifacts/public-test-results.xml
      - name: Upload public verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-verification-results
          path: artifacts/
          if-no-files-found: error
