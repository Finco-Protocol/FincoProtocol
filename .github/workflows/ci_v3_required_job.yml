name: CI V3 Required Public Test Job
'on':
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      tested-sha:
        type: string
        required: true
      merge-sha:
        type: string
        default: ''
      pr-number:
        type: string
        default: ''
      source-base:
        type: string
        required: true
    outputs:
      execution_mode:
        value: ${{ jobs.route.outputs.execution_mode }}
      controller_sha:
        value: ${{ inputs.tested-sha }}
permissions:
  contents: read
  actions: read
jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      execution_mode: ${{ steps.route.outputs.execution_mode }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.tested-sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Select production or operator rollback
      id: route
      env:
        ROLLBACK: ${{ vars.CI_V3_MANDATORY_ROLLBACK }}
        GH_TOKEN: ${{ github.token }}
        SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: python -m tools.ci_v3_production route --output routing-evidence
    env:
      FINCO_PRODUCTION_HEAD: ${{ inputs.tested-sha }}
      FINCO_PRODUCTION_BASE: ${{ inputs.source-base }}
      FINCO_PRODUCTION_MERGE_SHA: ${{ inputs.merge-sha }}
  sequential:
    needs:
    - route
    if: ${{ needs.route.outputs.execution_mode == 'sequential' }}
    uses: ./.github/workflows/ci_public_job.yml
    with:
      mode: control
      tested-sha: ${{ inputs.tested-sha }}
      merge-sha: ${{ inputs.merge-sha }}
      pr-number: ${{ inputs.pr-number }}
  plan:
    outputs:
      worker_matrix: ${{ steps.distribution.outputs.worker_matrix }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      FINCO_PRODUCTION_HEAD: ${{ inputs.tested-sha }}
      FINCO_PRODUCTION_BASE: ${{ inputs.source-base }}
      FINCO_PRODUCTION_MERGE_SHA: ${{ inputs.merge-sha }}
    needs:
    - route
    if: ${{ needs.route.outputs.execution_mode == 'parallel' }}
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.tested-sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Require exact source and identical PR merge tree
      run: python -m tools.ci_merge_tree_guard --expected '${{ inputs.tested-sha }}' --merge-sha '${{ inputs.merge-sha }}'
        --pr-number '${{ inputs.pr-number }}' --output merge-tree.json
    - name: Build pinned GCC runtime once (no registry/token)
      run: 'set -euo pipefail

        docker build --file docs/ci_v3/phase4/runtime/Dockerfile --tag finco-ci-v3:run --iidfile image-id.txt .

        docker save finco-ci-v3:run | gzip -n > runtime-image.tar.gz'
    - name: Full collection, authenticated original baseline and whole-module plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -m tools.ci_v3_production plan --output plan --image "$(cat image-id.txt)"
    - name: Expose exact current-source node ownership
      id: distribution
      run: "python - <<'PYCODE'\nimport json, os\nfrom pathlib import Path\nfrom tools.ci_v3_production import worker_matrix\n\
        with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:\n    print('worker_matrix='+json.dumps(worker_matrix(Path('plan')),\
        \ separators=(',', ':')), file=stream)\nPYCODE\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: public-ci-v3-plan
        path: plan/
        if-no-files-found: error
        retention-days: 30
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: ci-v3-runtime
        path: runtime-image.tar.gz
        if-no-files-found: error
        retention-days: 30
  worker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      FINCO_PRODUCTION_HEAD: ${{ inputs.tested-sha }}
      FINCO_PRODUCTION_BASE: ${{ inputs.source-base }}
      FINCO_PRODUCTION_MERGE_SHA: ${{ inputs.merge-sha }}
    needs:
    - route
    - plan
    if: ${{ needs.route.outputs.execution_mode == 'parallel' }}
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.tested-sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: public-ci-v3-plan
        path: evidence/public-ci-v3-plan
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ci-v3-runtime
        path: .
    - name: 'Execute original nodes: ${{ matrix.nodes }}'
      run: python -m tools.ci_v3_production worker --worker ${{ matrix.index }} --output worker-${{ matrix.index }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: public-ci-v3-worker-${{ matrix.index }}
        path: worker-${{ matrix.index }}/
        if-no-files-found: error
        retention-days: 30
    name: worker-${{ matrix.index }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.worker_matrix) }}
  aggregate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      FINCO_PRODUCTION_HEAD: ${{ inputs.tested-sha }}
      FINCO_PRODUCTION_BASE: ${{ inputs.source-base }}
      FINCO_PRODUCTION_MERGE_SHA: ${{ inputs.merge-sha }}
    needs:
    - route
    - plan
    - worker
    if: ${{ always() && needs.route.outputs.execution_mode == 'parallel' }}
    timeout-minutes: 15
    steps:
    - name: Fail on any selected worker failure
      env:
        WORKERS: ${{ needs.worker.result }}
        PLAN: ${{ needs.plan.result }}
      run: 'test "$PLAN" = success

        test "$WORKERS" = success

        '
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.tested-sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: public-ci-v3-*
        path: evidence
    - name: Independently authenticate all current worker artifacts and verify complete phases/native JUnit
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -m tools.ci_v3_production verify --independent --output proof
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: public-ci-v3-aggregate
        path: proof/
        if-no-files-found: error
        retention-days: 30
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
    - route
    - sequential
    - aggregate
    if: ${{ always() }}
    steps:
    - name: Preserve terminal required context; never retry selected failures
      env:
        ROUTE_RESULT: ${{ needs.route.result }}
        MODE: ${{ needs.route.outputs.execution_mode }}
        SEQUENTIAL_RESULT: ${{ needs.sequential.result }}
        PARALLEL_RESULT: ${{ needs.aggregate.result }}
      run: "test \"$ROUTE_RESULT\" = success\nif [ \"$MODE\" = parallel ]; then\n  test \"$PARALLEL_RESULT\" = success\n \
        \ test \"$SEQUENTIAL_RESULT\" = skipped\nelif [ \"$MODE\" = sequential ]; then\n  test \"$SEQUENTIAL_RESULT\" = success\n\
        \  test \"$PARALLEL_RESULT\" = skipped\nelse\n  exit 1\nfi"
