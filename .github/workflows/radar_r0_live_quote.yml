name: Radar R0 Live Quote Proof

on:
  push:
    branches: [radar/r0-execution-quote-authority]
    paths:
      - "finco_radar/**"
      - "tests/test_radar_r0_quotes.py"
      - ".github/workflows/radar_r0_live_quote.yml"
  workflow_dispatch:

jobs:
  live-quote-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install R0 runtime dependencies
        run: python -m pip install "httpx>=0.27,<1"
      - name: Run live amount-specific quote proof
        run: python -m finco_radar.r0.live_proof
      - name: Require observed size-aware economics
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          data = json.loads(Path("artifacts/radar_r0_live_quote_evidence.json").read_text())
          buy = Decimal(data["sizeImpactBps"]["BUY"])
          sell = Decimal(data["sizeImpactBps"]["SELL"])
          if buy == 0 and sell == 0:
              raise SystemExit("R0_BLOCKED: no size-dependent quote economics observed")
          print(f"R0_SIZE_AWARE_PASS BUY={buy}bps SELL={sell}bps")
          PY
      - name: Upload R0 quote evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: radar-r0-live-quote-evidence
          path: artifacts/radar_r0_live_quote_evidence.json
          if-no-files-found: error
