name: Governance Full History

on:
  pull_request:

permissions:
  contents: read

jobs:
  authoritative-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact pull-request head with full ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          python -m pip check
      - name: Authoritative PR history and stream governance
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "GOVERNANCE_EVENT_BASE_SHA=$PR_BASE_SHA"
          echo "GOVERNANCE_EVENT_HEAD_SHA=$PR_HEAD_SHA"
          echo "GOVERNANCE_EVENT_HEAD_REF=$PR_HEAD_REF"
          python tools/governance_history_gate.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --repo-root .
      - name: M-9 deterministic governance fixtures
        run: python -m pytest -q tests/test_opus_m9_governance_history.py
