name: CI Public Test Job

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      tested-sha:
        type: string
        required: true
      merge-sha:
        type: string
        default: ''
      pr-number:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tested-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci-tests.txt
            constraints.txt
      - name: Attest exact tested HEAD
        run: python -m tools.ci_acceptance attest --expected '${{ inputs.tested-sha }}' --output artifacts/source.json
      - name: Prove identical synthetic merge tree before full regression
        run: |
          test '${{ inputs.mode }}' = control
          python -m tools.ci_merge_tree_guard \
            --expected '${{ inputs.tested-sha }}' \
            --merge-sha '${{ inputs.merge-sha }}' \
            --pr-number '${{ inputs.pr-number }}' \
            --output artifacts/merge-tree.json
      - name: Install and record dependency preparation
        run: |
          python -m tools.ci_acceptance run --expected '${{ inputs.tested-sha }}' --label install --output artifacts/install.json -- \
            bash -e -c 'python -m pip install --upgrade pip; pip install -r requirements.txt -c constraints.txt; pip install -r requirements-ci-tests.txt -c constraints.txt; python -m pip check'
      - name: Synthetic reference and regression tests (FULL, UNSHARDED, EXACT HEAD)
        env:
          FINCO_CI_PYTEST_BUDGET_S: '6000'
          FINCO_CI_EXIT_GRACE_S: '240'
          FINCO_CI_DIAG_PATH: artifacts/ci-hang-diagnostics.txt
          FINCO_CI_PROGRESS_DIR: artifacts/progress
          FINCO_CI_STALL_S: '300'
        run: |
          python -m tools.ci_acceptance run --expected '${{ inputs.tested-sha }}' --label control \
            --output artifacts/process.json --junit artifacts/results.xml -- \
            python tools/ci_pytest_runner.py -q -p tools.ci_pytest_inventory -p tools.ci_pytest_progress \
            --ci-inventory=artifacts/inventory.json --ci-progress=artifacts/progress \
            --junitxml=artifacts/results.xml
      - name: Print slowest-test and active-test evidence
        if: always()
        run: python -m tools.ci_pytest_progress artifacts/progress || true
      - name: Retain historical public JUnit filename
        if: always()
        run: |
          if [ -f artifacts/results.xml ]; then cp artifacts/results.xml artifacts/public-test-results.xml; fi
      - name: Upload complete public evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-verification-results
          path: artifacts/
          if-no-files-found: error
