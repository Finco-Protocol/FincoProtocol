name: CI Public Test Job

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      tested-sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tested-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Attest tested source
        run: python -m tools.ci_acceptance attest --expected '${{ inputs.tested-sha }}' --output artifacts/source.json
      - name: Install and record dependency preparation
        run: |
          python -m tools.ci_acceptance run --expected '${{ inputs.tested-sha }}' --label install --output artifacts/install.json -- \
            bash -e -c 'python -m pip install --upgrade pip; pip install -r requirements.txt -c constraints.txt; python -m pip check'
      - name: Public repository safety scan
        if: inputs.mode == 'integration'
        run: python -m tools.ci_acceptance run --expected '${{ inputs.tested-sha }}' --label scan --output artifacts/scan.json -- python tools/public_safety_scan.py
      - name: Compile
        if: inputs.mode == 'integration'
        run: python -m tools.ci_acceptance run --expected '${{ inputs.tested-sha }}' --label compile --output artifacts/compile.json -- python -m compileall -q .
      - name: Synthetic reference and regression tests
        env:
          FINCO_CI_PYTEST_BUDGET_S: '3300'
          FINCO_CI_EXIT_GRACE_S: '180'
          FINCO_CI_DIAG_PATH: artifacts/ci-hang-diagnostics.txt
          FINCO_CI_PROGRESS_DIR: artifacts/progress
          FINCO_CI_STALL_S: '300'
          MODE: ${{ inputs.mode }}
        run: |
          shard=()
          case "$MODE" in
            control|integration) ;;
            shard-0) shard=(--ci-shard=0) ;;
            shard-1) shard=(--ci-shard=1) ;;
            *) exit 1 ;;
          esac
          python -m tools.ci_acceptance run --expected '${{ inputs.tested-sha }}' --label "$MODE" \
            --output artifacts/process.json --junit artifacts/results.xml -- \
            python tools/ci_pytest_runner.py -q -p tools.ci_pytest_inventory -p tools.ci_pytest_progress \
            --ci-inventory=artifacts/inventory.json --ci-progress=artifacts/progress \
            --junitxml=artifacts/results.xml "${shard[@]}"
      - name: Print slowest-test and active-test evidence
        if: always()
        run: python -m tools.ci_pytest_progress artifacts/progress || true
      - name: Retain historical public JUnit filename
        if: always() && inputs.mode == 'control'
        run: cp artifacts/results.xml artifacts/public-test-results.xml
      - name: Upload complete public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.mode == 'control' && 'public-verification-results' || inputs.mode == 'integration' && 'public-merge-integration' || format('public-{0}', inputs.mode) }}
          path: artifacts/
          if-no-files-found: error
