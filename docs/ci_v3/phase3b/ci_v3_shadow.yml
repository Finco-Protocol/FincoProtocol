# DEPLOYABLE CANDIDATE - exact bytes for .github/workflows/ci_v3_shadow.yml. Kept OUTSIDE active workflows until
# Financial, Security and CI owners approve this exact content and the protected admission root is provisioned.
# Manual dispatch only; advisory evidence only; never a merge, financial or release acceptance.
name: FINCO V3 SHADOW ONLY - advisory three-worker evidence
'on':
  workflow_dispatch:
    inputs:
      tested_head:
        description: Exact owner-approved tested commit (input is not authority)
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-v3-shadow-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: controller
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CI_V3_ROOT_B64: ${{ vars.CI_V3_ROOT_B64 }}
      CI_V3_ROOT_SHA256: ${{ vars.CI_V3_ROOT_SHA256 }}
      CI_V3_REQUESTED_HEAD: ${{ inputs.tested_head }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ vars.CI_V3_CONTROLLER_SHA }}
        path: controller
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Materialize independently pinned owner root
      run: |-
        python - <<'PY'
        import base64, os
        from pathlib import Path
        value = os.environ.get('CI_V3_ROOT_B64', '')
        data = base64.b64decode(value, validate=True) if value else Path('docs/ci_v3/phase3a/admission-root.closed.json').read_bytes()
        Path(os.environ['RUNNER_TEMP'], 'ci-v3-root.json').write_bytes(data)
        PY
    - name: Verify service identity, immutable controller and owner bundle
      id: admit
      run: python -m tools.ci_v3_hosted_controller admit --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256" --output "$RUNNER_TEMP/admission"
    name: ci-v3-admission
    environment: ci-v3-shadow-admission
    outputs:
      tested_sha: ${{ steps.admit.outputs.tested_sha }}
      controller_sha: ${{ steps.admit.outputs.controller_sha }}
      root_sha256: ${{ steps.admit.outputs.root_sha256 }}
      root_b64: ${{ steps.admit.outputs.root_b64 }}
      image: ${{ steps.admit.outputs.image }}
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: controller
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CI_V3_ROOT_B64: ${{ needs.admission.outputs.root_b64 }}
      CI_V3_ROOT_SHA256: ${{ needs.admission.outputs.root_sha256 }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.admission.outputs.controller_sha }}
        path: controller
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Materialize independently pinned owner root
      run: |-
        python - <<'PY'
        import base64, os
        from pathlib import Path
        value = os.environ.get('CI_V3_ROOT_B64', '')
        data = base64.b64decode(value, validate=True) if value else Path('docs/ci_v3/phase3a/admission-root.closed.json').read_bytes()
        Path(os.environ['RUNNER_TEMP'], 'ci-v3-root.json').write_bytes(data)
        PY
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.admission.outputs.tested_sha }}
        path: subject
        fetch-depth: 0
        persist-credentials: false
    - name: Pull only admitted immutable execution image
      run: python -m tools.ci_v3_hosted_controller pull-image --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256" --output
        "$RUNNER_TEMP/image-state"
    - name: Actual full collection, reconciliation and conservative partition
      run: python -m tools.ci_v3_hosted_controller plan --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256" --project ../subject
        --output "$RUNNER_TEMP/payload-plan"
    - name: Retain independent host receipt anchor
      id: receipt
      run: python -m tools.ci_v3_hosted_controller outputs --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256" --output "$RUNNER_TEMP/payload-plan"
    - name: Upload original evidence with immutable service digest
      id: upload
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-v3-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/payload-plan/
        if-no-files-found: error
        retention-days: 14
    name: ci-v3-plan
    needs:
    - admission
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
      job_id: ${{ steps.receipt.outputs.job_id }}
  worker-0:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: controller
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CI_V3_ROOT_B64: ${{ needs.admission.outputs.root_b64 }}
      CI_V3_ROOT_SHA256: ${{ needs.admission.outputs.root_sha256 }}
      CI_V3_HOST_ANCHORS: '{"plan":${{ toJSON(needs.plan.outputs) }}}'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.admission.outputs.controller_sha }}
        path: controller
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Materialize independently pinned owner root
      run: |-
        python - <<'PY'
        import base64, os
        from pathlib import Path
        value = os.environ.get('CI_V3_ROOT_B64', '')
        data = base64.b64decode(value, validate=True) if value else Path('docs/ci_v3/phase3a/admission-root.closed.json').read_bytes()
        Path(os.environ['RUNNER_TEMP'], 'ci-v3-root.json').write_bytes(data)
        PY
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.admission.outputs.tested_sha }}
        path: subject
        fetch-depth: 0
        persist-credentials: false
    - name: Pull only admitted immutable execution image
      run: python -m tools.ci_v3_hosted_controller pull-image --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256" --output
        "$RUNNER_TEMP/image-state"
    - name: Real full-module worker in private no-network container
      run: python -m tools.ci_v3_hosted_controller worker --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256" --project ../subject
        --worker worker-0 --output "$RUNNER_TEMP/payload-worker-0"
    - name: Retain independent host receipt anchor
      id: receipt
      run: python -m tools.ci_v3_hosted_controller outputs --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256" --output "$RUNNER_TEMP/payload-worker-0"
        --worker worker-0
    - name: Upload original evidence with immutable service digest
      id: upload
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-v3-worker-0-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/payload-worker-0/
        if-no-files-found: error
        retention-days: 14
    name: ci-v3-worker-0
    needs:
    - admission
    - plan
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
      job_id: ${{ steps.receipt.outputs.job_id }}
  worker-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: controller
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CI_V3_ROOT_B64: ${{ needs.admission.outputs.root_b64 }}
      CI_V3_ROOT_SHA256: ${{ needs.admission.outputs.root_sha256 }}
      CI_V3_HOST_ANCHORS: '{"plan":${{ toJSON(needs.plan.outputs) }}}'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.admission.outputs.controller_sha }}
        path: controller
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Materialize independently pinned owner root
      run: |-
        python - <<'PY'
        import base64, os
        from pathlib import Path
        value = os.environ.get('CI_V3_ROOT_B64', '')
        data = base64.b64decode(value, validate=True) if value else Path('docs/ci_v3/phase3a/admission-root.closed.json').read_bytes()
        Path(os.environ['RUNNER_TEMP'], 'ci-v3-root.json').write_bytes(data)
        PY
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.admission.outputs.tested_sha }}
        path: subject
        fetch-depth: 0
        persist-credentials: false
    - name: Pull only admitted immutable execution image
      run: python -m tools.ci_v3_hosted_controller pull-image --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256" --output
        "$RUNNER_TEMP/image-state"
    - name: Real full-module worker in private no-network container
      run: python -m tools.ci_v3_hosted_controller worker --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256" --project ../subject
        --worker worker-1 --output "$RUNNER_TEMP/payload-worker-1"
    - name: Retain independent host receipt anchor
      id: receipt
      run: python -m tools.ci_v3_hosted_controller outputs --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256" --output "$RUNNER_TEMP/payload-worker-1"
        --worker worker-1
    - name: Upload original evidence with immutable service digest
      id: upload
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-v3-worker-1-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/payload-worker-1/
        if-no-files-found: error
        retention-days: 14
    name: ci-v3-worker-1
    needs:
    - admission
    - plan
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
      job_id: ${{ steps.receipt.outputs.job_id }}
  worker-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: controller
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CI_V3_ROOT_B64: ${{ needs.admission.outputs.root_b64 }}
      CI_V3_ROOT_SHA256: ${{ needs.admission.outputs.root_sha256 }}
      CI_V3_HOST_ANCHORS: '{"plan":${{ toJSON(needs.plan.outputs) }}}'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.admission.outputs.controller_sha }}
        path: controller
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Materialize independently pinned owner root
      run: |-
        python - <<'PY'
        import base64, os
        from pathlib import Path
        value = os.environ.get('CI_V3_ROOT_B64', '')
        data = base64.b64decode(value, validate=True) if value else Path('docs/ci_v3/phase3a/admission-root.closed.json').read_bytes()
        Path(os.environ['RUNNER_TEMP'], 'ci-v3-root.json').write_bytes(data)
        PY
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.admission.outputs.tested_sha }}
        path: subject
        fetch-depth: 0
        persist-credentials: false
    - name: Pull only admitted immutable execution image
      run: python -m tools.ci_v3_hosted_controller pull-image --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256" --output
        "$RUNNER_TEMP/image-state"
    - name: Real full-module worker in private no-network container
      run: python -m tools.ci_v3_hosted_controller worker --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256" --project ../subject
        --worker worker-2 --output "$RUNNER_TEMP/payload-worker-2"
    - name: Retain independent host receipt anchor
      id: receipt
      run: python -m tools.ci_v3_hosted_controller outputs --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256" --output "$RUNNER_TEMP/payload-worker-2"
        --worker worker-2
    - name: Upload original evidence with immutable service digest
      id: upload
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-v3-worker-2-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/payload-worker-2/
        if-no-files-found: error
        retention-days: 14
    name: ci-v3-worker-2
    needs:
    - admission
    - plan
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
      job_id: ${{ steps.receipt.outputs.job_id }}
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: controller
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CI_V3_ROOT_B64: ${{ needs.admission.outputs.root_b64 }}
      CI_V3_ROOT_SHA256: ${{ needs.admission.outputs.root_sha256 }}
      CI_V3_HOST_ANCHORS: '{"plan":${{ toJSON(needs.plan.outputs) }},"worker-0":${{ toJSON(needs.worker-0.outputs) }},"worker-1":${{ toJSON(needs.worker-1.outputs)
        }},"worker-2":${{ toJSON(needs.worker-2.outputs) }}}'
      ADMISSION_RESULT: ${{ needs.admission.result }}
    steps:
    - name: Require independent admission even on failure path
      working-directory: ${{ github.workspace }}
      run: test "$ADMISSION_RESULT" = success
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.admission.outputs.controller_sha }}
        path: controller
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Materialize independently pinned owner root
      run: |-
        python - <<'PY'
        import base64, os
        from pathlib import Path
        value = os.environ.get('CI_V3_ROOT_B64', '')
        data = base64.b64decode(value, validate=True) if value else Path('docs/ci_v3/phase3a/admission-root.closed.json').read_bytes()
        Path(os.environ['RUNNER_TEMP'], 'ci-v3-root.json').write_bytes(data)
        PY
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.admission.outputs.tested_sha }}
        path: subject
        fetch-depth: 0
        persist-credentials: false
    - name: Authenticate transfers and verify every original node and process
      run: python -m tools.ci_v3_hosted_controller aggregate --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256" --project
        ../subject --output "$RUNNER_TEMP/shadow-proof"
    - name: Retain advisory proof or explicit rejection
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-v3-advisory-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/shadow-proof/
        if-no-files-found: error
        retention-days: 14
    name: ci-v3-advisory-evidence
    if: always()
    needs:
    - admission
    - plan
    - worker-0
    - worker-1
    - worker-2
