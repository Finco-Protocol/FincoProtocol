# INACTIVE. Exact deployment and activation require independent owner approval.
name: Public Safety and Model Smoke
permissions:
  contents: read
concurrency:
  group: public-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Attest exact source
      run: python -m tools.ci_acceptance attest --expected '${{ github.event.pull_request.head.sha || github.sha
        }}' --output artifacts/source.json
    - name: Public repository safety scan
      run: python -m tools.ci_acceptance run --expected '${{ github.event.pull_request.head.sha || github.sha }}'
        --label scan --output artifacts/scan.json -- python tools/public_safety_scan.py
    - name: Compile tested source
      run: python -m tools.ci_acceptance run --expected '${{ github.event.pull_request.head.sha || github.sha }}'
        --label compile --output artifacts/compile.json -- python -m compileall -q .
    - name: Upload mandatory safety evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: public-source-safety
        path: artifacts/
        if-no-files-found: error
  safety-and-smoke:
    uses: ./.github/workflows/ci_v3_required_job.yml
    with:
      mode: control
      tested-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      merge-sha: ${{ github.event_name == 'pull_request' && github.sha || '' }}
      pr-number: ${{ github.event.pull_request.number || '' }}
    permissions:
      contents: read
      actions: read
  mandatory-evidence:
    if: always()
    needs:
    - source-safety
    - safety-and-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
    - name: Require one selected mandatory execution mode
      env:
        MODE: ${{ needs.safety-and-smoke.outputs.execution_mode }}
      run: test "$MODE" = sequential -o "$MODE" = parallel
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: public-*
        path: evidence
    - name: Verify single full control, source safety, JUnit and normal exit
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
        SOURCE_RESULT: ${{ needs.source-safety.result }}
        CONTROL_RESULT: ${{ needs.safety-and-smoke.result }}
      run: "python -m tools.ci_single_gate --expected \"$HEAD_SHA\" \\\n  --artifacts evidence --source-result \"\
        $SOURCE_RESULT\" --control-result \"$CONTROL_RESULT\" \\\n  --merge-sha \"$MERGE_SHA\" --output artifacts/public-single-proof.json\n"
      if: ${{ needs.safety-and-smoke.outputs.execution_mode == 'sequential' }}
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      if: ${{ needs.safety-and-smoke.outputs.execution_mode == 'parallel' }}
      with:
        ref: ${{ needs.safety-and-smoke.outputs.controller_sha }}
        path: controller
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      if: ${{ needs.safety-and-smoke.outputs.execution_mode == 'parallel' }}
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        path: subject
        fetch-depth: 0
        persist-credentials: false
    - name: Independently verify activated parallel coverage, phases and cleanup
      if: ${{ needs.safety-and-smoke.outputs.execution_mode == 'parallel' }}
      working-directory: controller
      env:
        GH_TOKEN: ${{ github.token }}
        CI_V3_ROOT_B64: ${{ needs.safety-and-smoke.outputs.root_b64 }}
        CI_V3_ROOT_SHA256: ${{ needs.safety-and-smoke.outputs.root_sha256 }}
        CI_V3_HOST_ANCHORS: ${{ needs.safety-and-smoke.outputs.host_anchors }}
        SOURCE_RESULT: ${{ needs.source-safety.result }}
        EXECUTION_RESULT: ${{ needs.safety-and-smoke.result }}
      run: 'test "$SOURCE_RESULT" = success

        test "$EXECUTION_RESULT" = success

        python - <<''PYCODE''

        import base64,os

        from pathlib import Path

        Path(os.environ[''RUNNER_TEMP''],''ci-v3-root.json'').write_bytes(base64.b64decode(os.environ[''CI_V3_ROOT_B64''],validate=True))

        PYCODE

        python -m tools.ci_v3_mandatory verify --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256"
        --project ../subject --output ../artifacts/parallel-required-proof'
    - name: Upload mandatory aggregate proof (historical artifact alias)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: public-shadow-proof
        path: artifacts/
        if-no-files-found: error
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
