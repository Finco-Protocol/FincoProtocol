# INACTIVE. Deployment of these exact bytes requires Financial/Security/CI governance approval.
name: "CI V3 Required Test Job \u2014 dormant activation candidate"
'on':
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      tested-sha:
        type: string
        required: true
      merge-sha:
        type: string
        default: ''
      pr-number:
        type: string
        default: ''
    outputs:
      execution_mode:
        value: ${{ jobs.route.outputs.execution_mode }}
      controller_sha:
        value: ${{ jobs.route.outputs.controller_sha }}
      root_sha256:
        value: ${{ jobs.route.outputs.root_sha256 }}
      root_b64:
        value: ${{ jobs.route.outputs.root_b64 }}
      tested_sha:
        value: ${{ jobs.route.outputs.tested_sha }}
      host_anchors:
        value: ${{ jobs.tests.outputs.host_anchors }}
permissions:
  contents: read
  actions: read
jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: controller
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CI_V3_ROOT_B64: ${{ vars.CI_V3_ROOT_B64 }}
      CI_V3_ROOT_SHA256: ${{ vars.CI_V3_ROOT_SHA256 }}
      CI_V3_REQUESTED_HEAD: ${{ inputs.tested-sha }}
    steps:
    - name: Default or operator rollback to sequential before any execution
      id: closed
      if: ${{ vars.CI_V3_MANDATORY_ENABLED != 'true' || vars.CI_V3_MANDATORY_ROLLBACK == 'true' }}
      working-directory: ${{ github.workspace }}
      run: echo "execution_mode=sequential" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ vars.CI_V3_CONTROLLER_SHA }}
        path: controller
        fetch-depth: 0
        persist-credentials: false
      if: ${{ vars.CI_V3_MANDATORY_ENABLED == 'true' && vars.CI_V3_MANDATORY_ROLLBACK != 'true' }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
      if: ${{ vars.CI_V3_MANDATORY_ENABLED == 'true' && vars.CI_V3_MANDATORY_ROLLBACK != 'true' }}
    - name: Materialize independently pinned owner root
      run: 'python - <<''PY''

        import base64, os

        from pathlib import Path

        value = os.environ.get(''CI_V3_ROOT_B64'', '''')

        data = base64.b64decode(value, validate=True) if value else Path(''docs/ci_v3/phase3a/admission-root.closed.json'').read_bytes()

        Path(os.environ[''RUNNER_TEMP''], ''ci-v3-root.json'').write_bytes(data)

        PY'
      if: ${{ vars.CI_V3_MANDATORY_ENABLED == 'true' && vars.CI_V3_MANDATORY_ROLLBACK != 'true' }}
    - name: Verify service identity, immutable controller and owner bundle
      id: open
      run: python -m tools.ci_v3_mandatory route --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256"
        --project . --output "$RUNNER_TEMP/mandatory-route.json"
      if: ${{ vars.CI_V3_MANDATORY_ENABLED == 'true' && vars.CI_V3_MANDATORY_ROLLBACK != 'true' }}
    name: ci-v3-route
    outputs:
      tested_sha: ${{ steps.open.outputs.tested_sha }}
      controller_sha: ${{ steps.open.outputs.controller_sha }}
      root_sha256: ${{ steps.open.outputs.root_sha256 }}
      root_b64: ${{ steps.open.outputs.root_b64 }}
      image: ${{ steps.open.outputs.image }}
      execution_mode: ${{ steps.closed.outputs.execution_mode || steps.open.outputs.execution_mode }}
    environment:
      name: ${{ vars.CI_V3_MANDATORY_ENABLED == 'true' && vars.CI_V3_MANDATORY_ROLLBACK != 'true' && 'ci-v3-mandatory-admission'
        || 'ci-v3-sequential-default' }}
  sequential:
    if: ${{ needs.route.outputs.execution_mode == 'sequential' }}
    needs:
    - route
    uses: ./.github/workflows/ci_public_job.yml
    with:
      mode: control
      tested-sha: ${{ inputs.tested-sha }}
      merge-sha: ${{ inputs.merge-sha }}
      pr-number: ${{ inputs.pr-number }}
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: controller
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CI_V3_ROOT_B64: ${{ needs.route.outputs.root_b64 }}
      CI_V3_ROOT_SHA256: ${{ needs.route.outputs.root_sha256 }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.route.outputs.controller_sha }}
        path: controller
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Materialize independently pinned owner root
      run: 'python - <<''PY''

        import base64, os

        from pathlib import Path

        value = os.environ.get(''CI_V3_ROOT_B64'', '''')

        data = base64.b64decode(value, validate=True) if value else Path(''docs/ci_v3/phase3a/admission-root.closed.json'').read_bytes()

        Path(os.environ[''RUNNER_TEMP''], ''ci-v3-root.json'').write_bytes(data)

        PY'
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.route.outputs.tested_sha }}
        path: subject
        fetch-depth: 0
        persist-credentials: false
    - name: Pull only admitted immutable execution image
      run: python -m tools.ci_v3_hosted_controller pull-image --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256
        "$CI_V3_ROOT_SHA256" --output "$RUNNER_TEMP/image-state"
    - name: Actual full collection, reconciliation and conservative partition
      run: python -m tools.ci_v3_hosted_controller plan --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256"
        --project ../subject --output "$RUNNER_TEMP/payload-plan"
    - name: Retain independent host receipt anchor
      id: receipt
      run: python -m tools.ci_v3_hosted_controller outputs --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256"
        --output "$RUNNER_TEMP/payload-plan"
    - name: Upload original evidence with immutable service digest
      id: upload
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-v3-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/payload-plan/
        if-no-files-found: error
        retention-days: 14
    name: ci-v3-plan
    needs:
    - route
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
      job_id: ${{ steps.receipt.outputs.job_id }}
    if: ${{ needs.route.outputs.execution_mode == 'parallel' }}
  worker-0:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: controller
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CI_V3_ROOT_B64: ${{ needs.route.outputs.root_b64 }}
      CI_V3_ROOT_SHA256: ${{ needs.route.outputs.root_sha256 }}
      CI_V3_HOST_ANCHORS: '{"plan":${{ toJSON(needs.plan.outputs) }}}'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.route.outputs.controller_sha }}
        path: controller
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Materialize independently pinned owner root
      run: 'python - <<''PY''

        import base64, os

        from pathlib import Path

        value = os.environ.get(''CI_V3_ROOT_B64'', '''')

        data = base64.b64decode(value, validate=True) if value else Path(''docs/ci_v3/phase3a/admission-root.closed.json'').read_bytes()

        Path(os.environ[''RUNNER_TEMP''], ''ci-v3-root.json'').write_bytes(data)

        PY'
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.route.outputs.tested_sha }}
        path: subject
        fetch-depth: 0
        persist-credentials: false
    - name: Pull only admitted immutable execution image
      run: python -m tools.ci_v3_hosted_controller pull-image --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256
        "$CI_V3_ROOT_SHA256" --output "$RUNNER_TEMP/image-state"
    - name: Real full-module worker in private no-network container
      run: python -m tools.ci_v3_hosted_controller worker --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256"
        --project ../subject --worker worker-0 --output "$RUNNER_TEMP/payload-worker-0"
    - name: Retain independent host receipt anchor
      id: receipt
      run: python -m tools.ci_v3_hosted_controller outputs --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256"
        --output "$RUNNER_TEMP/payload-worker-0" --worker worker-0
    - name: Upload original evidence with immutable service digest
      id: upload
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-v3-worker-0-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/payload-worker-0/
        if-no-files-found: error
        retention-days: 14
    name: ci-v3-worker-0
    needs:
    - route
    - plan
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
      job_id: ${{ steps.receipt.outputs.job_id }}
    if: ${{ needs.route.outputs.execution_mode == 'parallel' }}
  worker-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: controller
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CI_V3_ROOT_B64: ${{ needs.route.outputs.root_b64 }}
      CI_V3_ROOT_SHA256: ${{ needs.route.outputs.root_sha256 }}
      CI_V3_HOST_ANCHORS: '{"plan":${{ toJSON(needs.plan.outputs) }}}'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.route.outputs.controller_sha }}
        path: controller
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Materialize independently pinned owner root
      run: 'python - <<''PY''

        import base64, os

        from pathlib import Path

        value = os.environ.get(''CI_V3_ROOT_B64'', '''')

        data = base64.b64decode(value, validate=True) if value else Path(''docs/ci_v3/phase3a/admission-root.closed.json'').read_bytes()

        Path(os.environ[''RUNNER_TEMP''], ''ci-v3-root.json'').write_bytes(data)

        PY'
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.route.outputs.tested_sha }}
        path: subject
        fetch-depth: 0
        persist-credentials: false
    - name: Pull only admitted immutable execution image
      run: python -m tools.ci_v3_hosted_controller pull-image --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256
        "$CI_V3_ROOT_SHA256" --output "$RUNNER_TEMP/image-state"
    - name: Real full-module worker in private no-network container
      run: python -m tools.ci_v3_hosted_controller worker --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256"
        --project ../subject --worker worker-1 --output "$RUNNER_TEMP/payload-worker-1"
    - name: Retain independent host receipt anchor
      id: receipt
      run: python -m tools.ci_v3_hosted_controller outputs --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256"
        --output "$RUNNER_TEMP/payload-worker-1" --worker worker-1
    - name: Upload original evidence with immutable service digest
      id: upload
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-v3-worker-1-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/payload-worker-1/
        if-no-files-found: error
        retention-days: 14
    name: ci-v3-worker-1
    needs:
    - route
    - plan
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
      job_id: ${{ steps.receipt.outputs.job_id }}
    if: ${{ needs.route.outputs.execution_mode == 'parallel' }}
  worker-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: controller
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CI_V3_ROOT_B64: ${{ needs.route.outputs.root_b64 }}
      CI_V3_ROOT_SHA256: ${{ needs.route.outputs.root_sha256 }}
      CI_V3_HOST_ANCHORS: '{"plan":${{ toJSON(needs.plan.outputs) }}}'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.route.outputs.controller_sha }}
        path: controller
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Materialize independently pinned owner root
      run: 'python - <<''PY''

        import base64, os

        from pathlib import Path

        value = os.environ.get(''CI_V3_ROOT_B64'', '''')

        data = base64.b64decode(value, validate=True) if value else Path(''docs/ci_v3/phase3a/admission-root.closed.json'').read_bytes()

        Path(os.environ[''RUNNER_TEMP''], ''ci-v3-root.json'').write_bytes(data)

        PY'
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.route.outputs.tested_sha }}
        path: subject
        fetch-depth: 0
        persist-credentials: false
    - name: Pull only admitted immutable execution image
      run: python -m tools.ci_v3_hosted_controller pull-image --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256
        "$CI_V3_ROOT_SHA256" --output "$RUNNER_TEMP/image-state"
    - name: Real full-module worker in private no-network container
      run: python -m tools.ci_v3_hosted_controller worker --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256"
        --project ../subject --worker worker-2 --output "$RUNNER_TEMP/payload-worker-2"
    - name: Retain independent host receipt anchor
      id: receipt
      run: python -m tools.ci_v3_hosted_controller outputs --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256"
        --output "$RUNNER_TEMP/payload-worker-2" --worker worker-2
    - name: Upload original evidence with immutable service digest
      id: upload
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-v3-worker-2-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/payload-worker-2/
        if-no-files-found: error
        retention-days: 14
    name: ci-v3-worker-2
    needs:
    - route
    - plan
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
      job_id: ${{ steps.receipt.outputs.job_id }}
    if: ${{ needs.route.outputs.execution_mode == 'parallel' }}
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: controller
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      CI_V3_ROOT_B64: ${{ needs.route.outputs.root_b64 }}
      CI_V3_ROOT_SHA256: ${{ needs.route.outputs.root_sha256 }}
      CI_V3_HOST_ANCHORS: '{"plan":${{ toJSON(needs.plan.outputs) }},"worker-0":${{ toJSON(needs.worker-0.outputs)
        }},"worker-1":${{ toJSON(needs.worker-1.outputs) }},"worker-2":${{ toJSON(needs.worker-2.outputs) }}}'
      ADMISSION_RESULT: ${{ needs.route.result }}
    steps:
    - name: Require independent admission even on failure path
      working-directory: ${{ github.workspace }}
      run: test "$ADMISSION_RESULT" = success
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.route.outputs.controller_sha }}
        path: controller
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Materialize independently pinned owner root
      run: 'python - <<''PY''

        import base64, os

        from pathlib import Path

        value = os.environ.get(''CI_V3_ROOT_B64'', '''')

        data = base64.b64decode(value, validate=True) if value else Path(''docs/ci_v3/phase3a/admission-root.closed.json'').read_bytes()

        Path(os.environ[''RUNNER_TEMP''], ''ci-v3-root.json'').write_bytes(data)

        PY'
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.route.outputs.tested_sha }}
        path: subject
        fetch-depth: 0
        persist-credentials: false
    - name: Authenticate transfers and verify every original node and process
      run: python -m tools.ci_v3_mandatory verify --root "$RUNNER_TEMP/ci-v3-root.json" --root-sha256 "$CI_V3_ROOT_SHA256"
        --project ../subject --output "$RUNNER_TEMP/shadow-proof"
    - name: Retain advisory proof or explicit rejection
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: finco-v3-advisory-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/shadow-proof/
        if-no-files-found: error
        retention-days: 14
    name: ci-v3-advisory-evidence
    if: ${{ always() && needs.route.outputs.execution_mode == 'parallel' }}
    needs:
    - route
    - plan
    - worker-0
    - worker-1
    - worker-2
  tests:
    name: tests
    needs:
    - route
    - sequential
    - aggregate
    - plan
    - worker-0
    - worker-1
    - worker-2
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      host_anchors: ${{ steps.anchors.outputs.host_anchors }}
    steps:
    - name: Require the selected execution to pass without a retry
      env:
        ROUTE_RESULT: ${{ needs.route.result }}
        MODE: ${{ needs.route.outputs.execution_mode }}
        SEQUENTIAL_RESULT: ${{ needs.sequential.result }}
        PARALLEL_RESULT: ${{ needs.aggregate.result }}
      run: "test \"$ROUTE_RESULT\" = success\nif [ \"$MODE\" = sequential ]; then\n  test \"$SEQUENTIAL_RESULT\"\
        \ = success\nelse\n  test \"$MODE\" = parallel\n  test \"$PARALLEL_RESULT\" = success\nfi"
    - id: anchors
      env:
        HOST_ANCHORS: '{"plan":${{ toJSON(needs.plan.outputs) }},"worker-0":${{ toJSON(needs.worker-0.outputs) }},"worker-1":${{
          toJSON(needs.worker-1.outputs) }},"worker-2":${{ toJSON(needs.worker-2.outputs) }}}'
      run: echo "host_anchors=$HOST_ANCHORS" >> "$GITHUB_OUTPUT"
